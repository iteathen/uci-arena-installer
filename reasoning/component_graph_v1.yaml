  - {id: I-I2, more_important: I-T2, less_important: I-T8, context: recurring_application_release_maintenance, confidence: 0.93}
  - {id: I-I3, more_important: I-T10, less_important: I-T8, context: platform_divergence_would_create_different_product_semantics, confidence: 0.88}

exports:
