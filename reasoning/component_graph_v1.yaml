  I-A7: [I-T5, I-T9]
  I-A8: [I-T4, I-T5, I-T9]

dominance_relations:
  - {id: I-D1, stronger: I-T5, weaker: I-T8, context: convenience_conflicts_with_exact_identity, confidence: 0.995, consequence: critical}
  - {id: I-D2, stronger: I-T7, weaker: I-T8, context: simplification_would_destroy_user_owned_or_recovery_state, confidence: 0.995, consequence: critical}
  - {id: I-D3, stronger: I-T2, weaker: I-T8, context: short_term_convenience_adds_recurring_product_specific_installer_code, confidence: 0.91, consequence: major}
  - {id: I-D4, stronger: I-T4, weaker: I-T8, context: happy_path_simplicity_weakens_interruption_recovery, confidence: 0.96, consequence: major}

