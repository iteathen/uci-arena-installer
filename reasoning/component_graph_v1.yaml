  I-A5: [I-T1, I-T2, I-T5]
  I-A6: [I-T1, I-T5]
  I-A7: [I-T5, I-T9]
  I-A8: [I-T4, I-T5, I-T9]

dominance_relations:
  - {id: I-D1, stronger: I-T5, weaker: I-T8, context: convenience_conflicts_with_exact_identity, strength: strict_necessary_condition, basis: [I-P6, I-A6], confidence: 0.995, consequence: critical}
  - {id: I-D2, stronger: I-T7, weaker: I-T8, context: simplification_would_destroy_user_owned_or_recovery_state, strength: strict_necessary_condition, basis: [I-P4, I-P8, I-A2], confidence: 0.995, consequence: critical}
  - {id: I-D3, stronger: I-T2, weaker: I-T8, context: short_term_convenience_adds_recurring_product_specific_installer_code, strength: strong_conditional, basis: [I-P2, I-A1, I-A3], confidence: 0.91, consequence: major}
  - {id: I-D4, stronger: I-T4, weaker: I-T8, context: happy_path_simplicity_weakens_interruption_recovery, strength: strong_conditional, basis: [I-P7, I-A2, I-A8], confidence: 0.96, consequence: major}

