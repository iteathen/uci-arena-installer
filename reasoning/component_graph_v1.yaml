  I-T4: [I-O1, I-P7, G-P20]
  I-T5: [I-O2, I-P1, I-P6, G-P6]
  I-T6: [I-O1, I-P2, I-P5]
  I-T7: [I-O1, I-P4, I-P8]
  I-T8: [I-O1, G-P7, I-P2]
  I-T9: [I-O1, I-P7, G-P20]
  I-T10: [I-O1, I-O2, I-P3, I-P5]

assertion_relevance:
