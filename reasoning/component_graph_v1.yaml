schema: uci_arena_component_reasoning_graph_v1
graph_id: uci_arena_installer
version: 1
status: initial_owner_directed
component: uci_arena_installer
concern_areas: [C03, C04, C08, C09, C10, C11, C12]
global_graph: reasoning/suite_graph_v1.yaml

imports:
  objectives: [G-O1, G-O2]
  premises: [G-P4, G-P6, G-P7, G-P20, G-P21, G-P23]
  targets: [G-T6, G-T7, G-T8, G-T12, G-T14]

local_objectives:
  - id: I-O1
    statement: >
      Make a complete UCI Arena proving environment easy to install, update, repair,
      recover, and remove on Windows and Linux.
    derived_from: [G-O2]
    confidence: 0.995
  - id: I-O2
    statement: >
      Preserve exact, reproducible suite composition so chess and evidence changes are not
      confounded by deployment drift.
    derived_from: [G-O1, G-T6]
    confidence: 0.97

premises:
  - id: I-P1
    statement: >
      Independently released components can describe installation requirements through
      immutable manifests, provenance, contracts, and composition data.
    confidence: 0.98
  - id: I-P2
    statement: >
      Application components evolve more frequently than stable installation mechanisms, and
      many ordinary component changes can be fully represented by existing manifests,
      compatibility declarations, composition data, and immutable artifacts.
    confidence: 0.99
  - id: I-P3
    statement: >
      Future code defaults can differ from the policy and roots under which an existing
      installation was created; reconstructing installed state from current defaults can
      misidentify the actual installation.
    confidence: 0.98
  - id: I-P4
    statement: >
      User-owned data, credentials, external books/tablebases, and useful retained evidence
      are distinct from replaceable program payloads.
    confidence: 0.995
  - id: I-P5
    statement: >
      Windows and Linux need different low-level adapters but should share installation
      semantics wherever the platform does not force a difference.
    confidence: 0.96

  - id: I-P6
    statement: >
      Exact artifact identity is necessary but not sufficient for a valid suite; selected
      component versions and public contracts must also be mutually compatible.
    confidence: 0.995
  - id: I-P7
    statement: >
      An interrupted or partially applied suite update can leave a mixed generation whose
      behavior differs from both the prior and intended suite even when every individual file
      is authentic.
    confidence: 0.99
  - id: I-P8
    statement: >
      Operator-selected install scope, roots, preserved external locators, and ownership
      boundaries are part of installed-state identity and cannot be safely reconstructed from
      future defaults alone.
    confidence: 0.99

premise_metadata:
  I-P1: {kind: structural}
  I-P2: {kind: empirical_regular}
  I-P3: {kind: structural}
  I-P4: {kind: structural}
  I-P5: {kind: structural}
  I-P6: {kind: structural}
  I-P7: {kind: material_risk}
  I-P8: {kind: structural}

implicit_assertions:
  - id: I-A1
    statement: >
      Product-specific setup branches increase the probability that ordinary component
      changes will require Installer source changes.
    derived_from: [I-P1, I-P2]
    confidence: 0.97
  - id: I-A2
    statement: >
      A successful update that cannot recover from interruption or preserve the last working
      installation does not satisfy usability merely because the happy path is simple.
    derived_from: [G-O2, I-P4]
    confidence: 0.98
  - id: I-A3
    statement: >
      Rebuilding stable OS integration or bootstrap for every application-only release creates
      avoidable release coupling and weakens durability.
    derived_from: [I-P2, G-T12]
    confidence: 0.97
  - id: I-A4
    statement: >
      If Windows and Linux derive old installation meaning from different current-code
      conventions, cross-platform durability is incomplete.
    derived_from: [I-P3, I-P5]
    confidence: 0.94
  - id: I-A5
    statement: >
      Installer interpretation of chess, timing, book, evidence, or provider semantics would
      create a second semantic authority and increase future change radius.
    derived_from: [G-P4, I-P1]
    confidence: 0.99

  - id: I-A6
    statement: >
      A cryptographically valid component set that violates declared compatibility can install
      successfully at the byte level while producing an invalid proving environment.
    derived_from: [I-P1, I-P6]
    confidence: 0.995
  - id: I-A7
    statement: >
      A successful installation or upgrade establishes deployment correctness only; it does
      not itself establish engine strength, timing qualification, book quality, or provider
      behavior.
    derived_from: [G-P6, I-P1]
    confidence: 0.999
  - id: I-A8
    statement: >
      A mixed-generation partial update can confound later chess/evidence comparisons unless
      transaction recovery restores or explicitly identifies one coherent installed state.
    derived_from: [I-P7, G-P21]
    confidence: 0.99

assertion_metadata:
  I-A1: {inference: conditional, boundary: "Product-neutrality need not forbid component-specific data or producer-owned adapters; it forbids product names from selecting generic Installer mechanism."}
  I-A2: {inference: structural, boundary: "Recovery complexity is not disfavored when it protects real installed/user state."}
  I-A3: {inference: conditional, boundary: "Platform integration may legitimately change when the integration contract itself changes."}
  I-A4: {inference: conditional, boundary: "Platform-specific mechanics may differ; only the meaning of installed authority and lifecycle outcomes needs semantic parity."}
  I-A5: {inference: structural, boundary: "Installer may validate declared compatibility and typed installation contracts without interpreting provider domain semantics."}
  I-A6: {inference: structural, boundary: "Compatibility checks do not independently establish runtime behavior or strength."}
  I-A7: {inference: structural, boundary: "Deployment qualification remains valuable inside its own scope."}
  I-A8: {inference: conditional, boundary: "A partial update can be acceptable only when its mixed state is itself an explicitly supported coherent generation."}

implementation_targets:
  - id: I-T1
    name: independently_composable_components
    statement: >
      Accept independently released conforming components without requiring generic deployment
      logic to know their product-specific internals.
    supports: [I-O1, I-O2, G-T12]
  - id: I-T2
    name: routine_component_evolution_without_mechanism_rewrite
    statement: >
      Let ordinary component version, payload, layout, and compatible contract changes flow
      through declared release inputs rather than requiring unrelated Installer mechanism changes.
    supports: [I-O1, I-O2]
  - id: I-T3
    name: durable_installed_state_identity
    statement: >
      Recover the exact meaning and locations of an existing installation across later
      Installer/default-policy changes.
    supports: [I-O1, G-T8]
  - id: I-T4
    name: coherent_recoverable_lifecycle_mutation
    statement: >
      Ensure install, update, repair, and removal either establish a coherent intended state or
      retain an explicit recoverable failure state under interruption and partial effects.
    supports: [I-O1, G-T8]
  - id: I-T5
    name: exact_deployment_identity_and_compatibility
    statement: >
      Establish exact artifact identity, provenance, selected composition, and declared
      compatibility before claiming a valid deployed suite.
    supports: [I-O2, G-T6]
  - id: I-T6
    name: application_release_independence_from_stable_platform_integration
    statement: >
      Permit ordinary application releases to change without needlessly replacing stable
      platform integration whose contract remains compatible.
    supports: [I-O1, G-T12]
  - id: I-T7
    name: preserve_operator_owned_and_recovery_state
    statement: >
      Preserve operator-owned, externally owned, and recovery-relevant state unless the
      operator explicitly authorizes its destruction.
    supports: [I-O1, G-T14]
  - id: I-T8
    name: low_burden_deployment_workflow
    statement: >
      Minimize unnecessary operator work and ambiguity across installation, update, repair,
      release, and removal workflows.
    supports: [I-O1, G-T7]
  - id: I-T9
    name: truthful_deployment_failure_and_recovery_state
    statement: >
      Report success, failure, rollback, preservation, and unresolved recovery state without
      converting uncertainty or partial effects into success.
    supports: [I-O1, G-T8, G-T9]
  - id: I-T10
    name: cross_platform_installation_semantic_parity
    statement: >
      Preserve equivalent suite installation/lifecycle semantics across supported platforms
      except where genuine platform differences require different mechanics.
    supports: [I-O1, I-O2]

target_derivations:
  I-T1: [I-O1, I-O2, I-P1, I-P2, I-P6]
  I-T2: [I-O1, I-O2, I-P2]
  I-T3: [I-O1, I-P3, I-P8]
  I-T4: [I-O1, I-P7, G-P20]
  I-T5: [I-O2, I-P1, I-P6, G-P6]
  I-T6: [I-O1, I-P2, I-P5]
  I-T7: [I-O1, I-P4, I-P8]
  I-T8: [I-O1, G-P7, I-P2]
  I-T9: [I-O1, I-P7, G-P20]
  I-T10: [I-O1, I-O2, I-P3, I-P5]

