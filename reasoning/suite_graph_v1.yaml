  - {id: G-C4, cause: G-T3, effect: G-T4, relation: complementary_external_evidence, confidence: 0.94}
  - {id: G-C5, cause: G-T4, effect: G-T13, relation: necessary_condition, confidence: 0.99}
  - {id: G-C6, cause: G-T13, effect: G-O1, relation: feedback_improvement_path, confidence: 0.95}
  - {id: G-C7, cause: G-T5, effect: G-T11, relation: enabler, confidence: 0.95}
  - {id: G-C8, cause: G-T6, effect: G-T2, relation: necessary_condition_for_composed_validity, confidence: 0.97}
  - {id: G-C9, cause: G-T6, effect: G-T3, relation: necessary_condition_for_composed_validity, confidence: 0.97}
  - {id: G-C10, cause: G-T8, effect: G-T2, relation: enabler, confidence: 0.94}
  - {id: G-C11, cause: G-T9, effect: G-T4, relation: enabler, confidence: 0.92}
  - {id: G-C12, cause: G-T10, effect: G-T2, relation: validity_preserver, confidence: 0.96}
  - {id: G-C13, cause: G-T7, effect: G-T11, relation: enabler, confidence: 0.90}
