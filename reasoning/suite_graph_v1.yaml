cross_component_edges:
  - id: G-X1
    from: uci_arena_evidence_service
    to: uci_arena_vector
    statement: >
      Evidence may produce qualified future policy/artifact inputs; Vector owns live
      application against current engine/game facts. Evidence never commands active search.
    supports: [G-T4, G-T13, G-T6]
    confidence: 0.99
  - id: G-X2
    from: uci_arena_book_forge
    to: uci_arena_vector
    statement: >
      Book Forge produces qualified immutable opening knowledge; Vector consumes declared
      artifacts without learning Book Forge internals.
    supports: [G-T5, G-T6, G-T13]
    confidence: 0.98
  - id: G-X3
    from: uci_arena_lichess_bot
    to: uci_arena_vector
    statement: >
      Lichess Bot provides authoritative remote game state, clocks, transport constraints,
      and UCI process hosting while leaving chess move selection and chess-thinking policy to
      the selected engine.
    supports: [G-T3, G-T5, G-T6]
    confidence: 0.995
  - id: G-X4
    from: uci_arena_vector
    to: uci_arena_lichess_bot
    statement: >
      The selected engine returns legal current-state UCI moves and engine-owned timing
      behavior; the Bot submits them subject only to provider transport/API authority.
    supports: [G-T1, G-T3, G-T6]
    confidence: 0.995
  - id: G-X5
    from: uci_arena_manager
    to: all_components
    statement: >
      Manager exposes operator control, orchestration, status, and typed configuration through
      public component contracts without absorbing provider/engine semantic ownership.
    supports: [G-T7, G-T5, G-T6, G-T9]
    confidence: 0.98
  - id: G-X6
    from: uci_arena_installer
    to: all_components
    statement: >
      Installer composes exact immutable released artifacts and installation lifecycle without
      interpreting chess, evidence, book, or provider semantics.
    supports: [G-T6, G-T8, G-T12, G-T7]
    confidence: 0.99
  - id: G-X7
    from: uci_arena_lichess_bot
    to: uci_arena_evidence_service
    statement: >
      Completed external games and bounded runtime observations may become evidence inputs
      under explicit provenance and authority; live uncontrolled results do not automatically
      tune or qualify future policy.
    supports: [G-T3, G-T4, G-T13]
    confidence: 0.96

  - id: G-X8
    from: uci_arena_syzygy_root_provider
    to: uci_arena_vector
    statement: >
      The root-tablebase provider supplies exact or truthfully deferred root knowledge within
      its admitted dataset/history/rule scope; Vector retains canonical chess, search, legality,
      and live timing authority.
    supports: [G-T1, G-T5, G-T6]
    confidence: 0.995

