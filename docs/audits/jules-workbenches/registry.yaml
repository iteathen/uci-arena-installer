preferred_transport:
  kind: jules_rest_api
  control_repository: iteathen/Jules-control
  control_branch: main
  workflow: .github/workflows/jules-control.yml
  controller: scripts/jules_control.py
  secret_location: github_environment_secret
  environment: jules
  secret_name: JULES_API_KEY
  rules:
    - never place the API key in chat, issues, logs, argv, repository files, or task prompts
    - resolve the Jules source through the API and require an exact startingBranch
    - require plan approval for broad or security-sensitive tasks
    - review every Jules PR as hostile input in the source repository
    - close the control issue only after the output PR, session id, review disposition, and cleanup state are recorded
    - do not create a temporary clone when the API accepts the authoritative starting branch
concurrency:
  maximum_active_jules_sessions: 1
  active_sessions: 1
  rule: >-
    Keep one broad Jules implementation session active until its output is frozen and
    reviewed. Small direct fixes may continue independently, but do not create another
    broad Jules task that overlaps its ownership or ancestry.
