meta:
  spec_id: arena_install_layout_v1
  version: 1
  status: active
  owner: install_layout
  parent_issue: 80

authority_relationship: >
  Specialized active authority for semantic installation roots, installed
  policy snapshots, resolved installed-layout descriptors, Windows known-folder
  resolution, stable locator registration, packaging projections, legacy layout
  observation, and pure layout-transition planning. It supersedes independently
  authored Windows root formulas in manager-integration.json,
  suite-bundle.json, PowerShell updater defaults, and packaged setup CLI roots
  for the target architecture. Issue #7 owns physical exact-file admission and
  durable publication. Issue #9 is the sole mutation lease, journal,
  compensation, commit, and recovery authority for policy, descriptor, locator,
  receipt, and owned-path transitions.

purpose: >
  Give clean install, package-only update, repair, migration, uninstall, stable
  Manager dispatch, and fresh-install bootstrap one exact answer to where an
  installation lives. The source policy is semantic data rather than WiX,
  PowerShell, process environment, or application code. After commit, the exact
  installed policy snapshot, descriptor, and digest-bound locator—not current
  repository defaults—remain authority for that installation.

confirmed_current_defect:
  observations:
    - packaging/windows/manager-integration.json owns one program/data/runtime/launcher/scope-marker path map
    - packaging/windows/suite-bundle.json independently owns install/data/cache/knowledge roots
    - packaging/windows/apply-suite-update.ps1 independently reconstructs roots from environment variables
    - current full per-machine bundle supplies Program Files/UCI Arena Manager as SetupPaths.install_root
    - current routine updater defaults SetupPaths.install_root to ProgramData/UCI Arena Manager/installed
  conclusion: >
    A per-machine full installation and a later routine package update can
    address different component stores. This is a present competing-authority
    defect, not merely a future drift risk.

current_generation_fresh_package_selection:
  authority: >
    The project owner explicitly selected uninstall with preservation followed by
    a fresh E-volume installation on 2026-10-11. This bounded current-generation
    packaging route specializes the v1 custom-root restriction for fresh installs.
    It does not implement or claim IL-05, IL-06, IL-07 or transaction-v2 completion.
  persistence_owner: Windows Installer owns one transactional registry component
  schema: arena_package_layout_selection_v1
  registration:
    view: 64
    hive: HKCU for per-user; HKLM for per-machine
    key: Software/UCI Arena/Installer/PackageLayout/<scope>
    exact_string_values: [Schema, Scope, IntegrationRoot, DataRoot]
  selection:
    - IntegrationRoot and DataRoot are explicitly selected absolute normalized non-root paths
    - neither root contains or aliases the other
    - existing roots and ancestors require ordinary no-reparse admission
    - all children derive from the canonical policy-v2 relative expressions
    - repair remembers existing roots before applying defaults
    - conflicting root overrides reject before publication; changing location requires normal uninstall first
    - normal MSI uninstall removes selection registration and preserves application data
  public_projection:
    command: arena-setup --install-scope <scope> --json layout
    exact_fields: [schema, scope, integration_root, roots]
    exact_roots: [data, install, cache, workspace, knowledge]
    unavailable_or_invalid: controlled nonzero result without guessed roots
    consumers: [Manager desktop, Manager CLI setup adapter, routine updater, suite bundle]
    rule: >
      Installer alone reads and validates selected-root registration. Other
      consumers use its closed public projection and forward the complete root
      tuple. The updater may read IntegrationRoot only as a launcher pointer; the
      public installed runtime admits that pointer before its roots are used.
  limits:
    - this record is distinct from the future policy/digest-bound InstalledLayout descriptor and locator
    - this route creates no second transaction engine, journal, migration or registry writer
    - source data restoration remains a separately quiesced producer-owned operation
    - a missing selection retains existing explicit development and legacy diagnostic paths but cannot authorize installed Manager setup

hierarchy:
  lego:
    brick: InstallLayout
    owns:
      - one versioned semantic source policy for each supported layout generation
      - Windows known-folder anchor resolution
      - resolved root and stable-path validation
      - installed policy snapshot meaning
      - installed-layout descriptor meaning and SetupPaths projection
      - stable scope-specific locator meaning
      - pure legacy observation and transition-plan generation
      - Node, WiX, PowerShell, and runtime projections of the same policy
    replacement_boundary: policy version and platform adapters
    failure_boundary: policy, anchor, locator, descriptor, overlap, legacy observation, or transition-plan failure
    does_not_own:
      - physical identity or publication mechanics: issue 7
      - mutation lease, journal, activation, compensation, commit, cleanup, or recovery: issue 9
      - service/provider lifecycle, Manager behavior, or application data meaning
      - MSI/Burn/bootstrap technology
      - arbitrary custom install roots in v1
    topology_rule: >
      Policy, resolver, descriptor, locator, and transition planner remain one
      LEGO because they share one semantic owner, lifecycle, replacement
      boundary, and failure consequence. Platform and packaging implementations
      are adapters inside this brick rather than independent path authorities.
      InstallLayout never creates a second transaction engine.
  solid:
    single_responsibility:
      - policy validator owns semantic root expressions and static invariants
      - anchor adapter resolves known folders only
      - descriptor validator owns resolved installed-state truth
      - locator adapter reads and conditionally writes exact locator state only
      - transition planner compares exact observed state with one target without mutation
      - packaging adapters render policy into platform packaging syntax only
    open_closed:
      - a future platform adds anchor, locator, and packaging adapters without caller root branches
      - a future policy version is data plus an explicit transition, not copied formulas
    liskov:
      - Node and C++ resolve identical roots for identical policy, scope, and anchor values
      - every locator remains a pointer until exact policy and descriptor validation succeeds
      - every locator write uses one explicit prior-state precondition and one exact next record
    interface_segregation:
      - release tools consume policy projections, not registry APIs
      - runtime consumes InstalledLayout and SetupPaths, not WiX strings
      - updater consumes locator pointers and passes one descriptor path, not roots
      - transaction consumes LayoutTransitionPlan, not discovery policy
    dependency_inversion:
      - InstallLayout consumes issue #7 exact documents and publication
      - Windows known-folder and registry behavior stays behind narrow adapters
      - issue #9 consumes frozen transition, policy, descriptor, and locator effects
      - issues #77 and #79 consume InstalledLayout and locator without defining roots
  cupid:
    - composable policy, anchor, locator, descriptor, projection, and transition values
    - unix-like validators and resolvers with one bounded role
    - predictable scope, root, generation, digest, and locator behavior
    - idiomatic Node ESM, C++20, known-folder, and registry APIs
    - domain-based integration, data, install, cache, workspace, knowledge, release, receipt, transaction, and preservation vocabulary
  kiss: >
    Use the least complex complete implementation inside the fixed policy and
    ports. KISS cannot justify reconstructing current defaults, using environment
    roots as authority, embedding WiX syntax in the semantic policy, creating a
    second path map, accepting an unvalidated or stale locator, inferring legacy
    ownership from adjacency, or mutating outside issue #9.

source_policy:
  schema: arena_install_layout_policy_v1
  schema_file: specs/schemas/install-layout-policy.schema.json
  source_file: packaging/install-layout.json
  active:
    policy_id: arena_windows_standard
    policy_version: 2
    platform: windows-x86_64
  semantic_anchors:
    user_local_app_data:
      windows_api: FOLDERID_LocalAppData
      allowed_scope: per-user
    machine_program_files:
      windows_api: FOLDERID_ProgramFiles
      allowed_scope: per-machine
    machine_program_data:
      windows_api: FOLDERID_ProgramData
      allowed_scope: per-machine
  forbidden_anchor_sources:
    - process environment variables
    - current working directory
    - executable adjacency without policy validation
    - provider or application configuration
    - registry values other than exact locator pointers
  expression_rules:
    - integration and data are anchored roots
    - every other root is relative only to integration or data
    - no derived-root chaining or cycles
    - no absolute, dot, dot-dot, separator-containing, control-containing, trailing-dot, trailing-space, or Windows-reserved-device segment
    - validation and collision use Windows case-insensitive path semantics
  target_layout:
    per-user:
      integration: user_local_app_data/Programs/UCI Arena Manager
      data: user_local_app_data/UCI Arena Manager
      install: integration/installed
      cache: data/cache
      workspace: data/workspaces
      knowledge: data/knowledge
      release: data/release
      receipts: data/receipts
      transactions: data/transactions
      preservation: data/preservation
    per-machine:
      integration: machine_program_files/UCI Arena Manager
      data: machine_program_data/UCI Arena Manager
      install: integration/installed
      cache: data/cache
      workspace: data/workspaces
      knowledge: data/knowledge
      release: data/release
      receipts: data/receipts
      transactions: data/transactions
      preservation: data/preservation
    rationale: >
      Stable integration and immutable versioned application payloads live under
      the scope-correct executable root; mutable and preserved state lives under
      the scope-correct data root. The installed subroot prevents MSI-owned
      stable files and transaction-owned component roots from sharing file
      ownership. Both scopes use the same relative LEGO arrangement.
  stable_paths:
    policy: share/uci-arena/layout-policies/arena_windows_standard-v2.json
    descriptor: share/uci-arena/installed-layout.json
    scope_marker: share/uci-arena/install-scope.txt
    setup_launcher: bin/arena-setup.exe
    installer_runtime: libexec/uci-arena-installer
    path_directory: bin
    extension_rule: >
      Issue #77 may own stable Manager dispatcher leaf names beneath the already
      resolved integration root through its Windows-integration policy. Merely
      adding or renaming an Installer-owned dispatcher leaf does not create a
      new semantic root and does not require changing this layout policy unless
      the root or lifecycle meaning changes.
  policy_snapshot_ownership:
    - suite media carries exact target policy bytes
    - issue #9 publishes the exact policy snapshot to the versioned stable path before descriptor authority
    - descriptor pins policy id, version, path, and SHA-256
    - future policy versions use different versioned paths and never overwrite a prior snapshot
    - prior snapshots remain while any current or recoverable descriptor references them
    - MSI never owns, overwrites, repairs, or removes active policy snapshots or descriptors
  root_invariants:
    - integration and data are absolute normalized non-root paths and neither contains the other
    - install is exactly integration/installed
    - mutable roots are exact distinct direct children of data for policy v2
    - stable paths are exact descendants of integration and mutually noncolliding
    - no case-insensitive aliases exist among roots or stable paths
    - existing roots and ancestors pass issue #7 physical admission before use or mutation
    - per-user mutation remains non-elevated
    - per-machine mutation requires legitimate machine elevation
    - arbitrary custom roots are unsupported in v1

installed_descriptor:
  schema: arena_installed_layout_v1
  schema_file: specs/schemas/installed-layout.schema.json
  destination: integration/share/uci-arena/installed-layout.json
  immutable_identity:
    installation_id: generated once and retained through migrations
    platform: windows-x86_64
    scope: per-user or per-machine
  generation:
    - initialization creates generation 1
    - each committed transition increments exactly one
    - rollback or repeated recovery never skips or double-increments
  validation:
    - exact-read duplicate-rejecting policy and descriptor through issue #7
    - policy digest, id, version, and path match descriptor
    - resolve policy using descriptor scope and exact platform anchors
    - integration root, every root, and every stable path equal the resolved policy exactly
    - descriptor self-path equals resolved descriptor stable path
    - current repository policy is irrelevant to an older installed snapshot
    - malformed, missing, linked, reparse-substituted, wrong-scope, overlapping, or escaping state fails before mutation
  publication:
    - policy snapshot and descriptor use issue #7 absent or exact-prior-digest preconditions
    - only PublicationOutcome activated establishes authority
    - activated_durability_unproven or indeterminate remains transaction failure and recovery evidence
    - prior descriptor and policy are never deleted before replacement
  SetupPaths_projection:
    install_root: roots.install
    data_root: roots.data
    cache_root: roots.cache
    workspace_root: roots.workspace
    knowledge_root: roots.knowledge
    invocation_only:
      - bundle_owner
      - restart_manager_service
      - manager_service_access
    rule: >
      Every packaged production path derives only from InstalledLayout. Raw root
      CLI flags may remain only for bounded tests and explicit development, and
      cannot discover, create, update, or claim installed authority.

common_runtime_contract:
  files:
    port_header: include/arena/ports/install_layout.hpp
    domain_header: include/arena/application/installer/install_layout.hpp
    common_source: src/application/installer/install_layout.cpp
    platform_header: include/arena/platform/install_layout.hpp
    windows_source: src/platform/windows/install_layout.cpp
  domain_types: |
    enum class InstallScope { per_user, per_machine };
    enum class LayoutAnchor {
        user_local_app_data,
        machine_program_files,
        machine_program_data,
    };

    struct InstallLayoutRoots {
        std::filesystem::path integration;
        std::filesystem::path data;
        std::filesystem::path install;
        std::filesystem::path cache;
        std::filesystem::path workspace;
        std::filesystem::path knowledge;
        std::filesystem::path release;
        std::filesystem::path receipts;
        std::filesystem::path transactions;
        std::filesystem::path preservation;
    };

    struct InstallLayoutStablePaths {
        std::filesystem::path policy;
        std::filesystem::path descriptor;
        std::filesystem::path scope_marker;
        std::filesystem::path setup_launcher;
        std::filesystem::path installer_runtime;
        std::filesystem::path path_directory;
    };

    struct ResolvedInstallLayout {
        std::string policy_id;
        std::uint64_t policy_version;
        InstallScope scope;
        InstallLayoutRoots roots;
        InstallLayoutStablePaths stable_paths;
    };

    struct InstalledLayout {
        std::string installation_id;
        std::uint64_t layout_generation;
        std::string policy_sha256;
        ResolvedInstallLayout resolved;
    };
  locator_type: |
    struct InstallLayoutLocatorRecord {
        std::string schema = "arena_install_layout_locator_v1";
        InstallScope scope;
        std::string installation_id;
        std::uint64_t layout_generation;
        std::filesystem::path integration_root;
        std::filesystem::path policy_path;
        std::string policy_sha256;
        std::filesystem::path descriptor_path;
        std::string descriptor_sha256;
        std::filesystem::path setup_launcher_path;
    };
  ports: |
    class InstallLayoutAnchorResolver {
      public:
        virtual ~InstallLayoutAnchorResolver() = default;
        [[nodiscard]] virtual std::filesystem::path
        resolve(LayoutAnchor anchor) const = 0;
    };

    class InstallLayoutLocator {
      public:
        virtual ~InstallLayoutLocator() = default;
        [[nodiscard]] virtual std::optional<InstallLayoutLocatorRecord>
        read(InstallScope scope) const = 0;
    };
  common_functions: |
    [[nodiscard]] nlohmann::json
    validate_install_layout_policy(const nlohmann::json& candidate);

    [[nodiscard]] ResolvedInstallLayout
    resolve_install_layout(const nlohmann::json& validated_policy,
                           InstallScope scope,
                           const InstallLayoutAnchorResolver& anchors);

    [[nodiscard]] InstalledLayout
    validate_installed_layout(const nlohmann::json& validated_policy,
                              std::string_view policy_sha256,
                              const nlohmann::json& descriptor,
                              const InstallLayoutAnchorResolver& anchors);

    [[nodiscard]] InstallLayoutLocatorRecord
    locator_from_installed_layout(const InstalledLayout& layout,
                                  std::string_view descriptor_sha256);

    [[nodiscard]] SetupPaths
    setup_paths_from_layout(const InstalledLayout& layout,
                            std::string bundle_owner,
                            bool restart_manager_service,
                            bool manager_service_access);
  rules:
    - domain types and functions contain no registry, WiX, or known-folder identifiers
    - anchor and locator ports contain no environment or default-reconstruction method
    - registry mutation is a typed issue #9 effect, not a public InstallLayout mutator
    - Node and C++ golden fixtures resolve identical paths under synthetic anchors

windows_anchor_adapter:
  - resolve known folders through SHGetKnownFolderPath or equivalent exact API
  - never fall back to process environment
  - user anchor is forbidden for machine scope and machine anchors forbidden for user scope
  - result is absolute and normalized
  - existing paths are physically admitted when required
  - failure is typed and bounded with no opposite-scope fallback

windows_locator:
  schema: arena_install_layout_locator_v1
  schema_file: specs/schemas/install-layout-locator.schema.json
  registry_subkey: Software/UCI Arena/Installer
  hives:
    per-user: HKCU 64-bit view
    per-machine: HKLM 64-bit view
  values:
    LayoutLocatorSchema: arena_install_layout_locator_v1
    InstallScope: per-user or per-machine
    InstallationId: exact installation UUID
    LayoutGeneration: exact positive generation
    IntegrationRoot: integration pointer
    LayoutPolicyPath: active policy snapshot pointer
    LayoutPolicySha256: exact policy digest
    InstalledLayoutPath: active descriptor pointer
    InstalledLayoutSha256: exact descriptor digest
    SetupLauncherPath: stable launcher pointer
  ownership:
    - registry is pointer and digest registration only, never semantic root authority
    - issue #9 conditionally writes or deletes the complete value set as one typed compensatable effect
    - MSI does not claim locator authority
  discovery:
    - auto reads both exact hives and requires exactly one valid record
    - explicit scope reads only its exact hive and rejects a contradictory live opposite-scope record where exclusivity applies
    - exact policy bytes must match locator policy digest and reproduce integration and stable pointers
    - exact descriptor bytes must match locator descriptor digest, installation id, generation, policy, scope, roots, and stable paths
    - setup launcher equals the exact stable path and passes physical admission before launch
    - malformed, partial, missing, contradictory, stale, linked, or reparse-substituted locator fails before mutation
    - registry values never authorize current-default reconstruction
  updater_rule: >
    apply-suite-update.ps1 reads one complete locator, validates pointer
    relationships, launches the registered exact setup launcher, and passes
    `--installed-layout <descriptor>`. It never computes semantic roots from
    environment variables.

node_packaging_projection:
  module: tools/release/install-layout.mjs
  owns:
    - exact manual policy validation and semantic invariants
    - synthetic-anchor resolution for tests
    - WiX path expressions from semantic roots
    - stable relative destinations and locator value names
    - deterministic golden projection
  wix_mapping:
    user_local_app_data: LocalAppDataFolder
    machine_program_files: ProgramFiles64Folder
    machine_program_data: CommonAppDataFolder
  post_migration_ownership:
    packaging/install-layout.json:
      - every root expression
      - stable relative destinations
      - locator registry subkey and value names
    packaging/windows/manager-integration.json:
      - display and manufacturer
      - Manager role names
      - shortcut and service identity
      - upgrade codes and non-layout OS integration policy
      - no root, data, runtime, launcher, scope-marker, or PATH-directory formulas
    packaging/windows/suite-bundle.json:
      - display and manufacturer
      - feature controls
      - scope UI, elevation, and upgrade codes
      - no install, data, cache, workspace, knowledge, or release formula
  packaging_rules:
    - manager MSI and suite bundle consume one validated policy projection
    - MSI owns stable binaries, runtime, scope marker, PATH, service, and shortcut registrations only
    - MSI does not install, remove, repair, or overwrite policy snapshots, descriptor, locator, or component store
    - suite media carries exact target policy to arena-setup initialization or migration
    - issue #9 publishes policy, descriptor, receipts, and locator
    - MSI repair never overwrites transaction-owned layout state or payloads
    - component invocation passes policy or installed-layout operation, not duplicate roots

legacy_observation:
  policy_id: arena_windows_legacy_0_3x
  known_anchors:
    per-user:
      integration: user_local_app_data/Programs/UCI Arena Manager
      data: user_local_app_data/UCI Arena Manager
    per-machine:
      integration: machine_program_files/UCI Arena Manager
      data: machine_program_data/UCI Arena Manager
  recognized_install_variants:
    per-user_full_or_routine: data/installed
    per-machine_full_bundle: integration
    per-machine_routine_drift: data/installed
    split_receipt_state: exact active receipts span recognized variants
  rules:
    - enabled only by explicit full integration-protocol migration
    - inspect exact scope marker, runtime, and receipt bytes through issue #7
    - derive each active component source root from its exact receipt rather than a guessed variant
    - classify variants for evidence only
    - unrecognized, escaping, linked, modified, duplicate, or contradictory roots fail
    - split state is planable only with one exact authoritative receipt per component
    - user and external data are never inferred from adjacency
    - exact manifest and receipt-owned workspaces may move
    - external and operator-owned paths remain where declared
    - no legacy formula remains in the normal post-migration updater

layout_transition_plan:
  owner: InstallLayout pure planner
  consumer: issue 9 InstallTransactionCoordinator
  conceptual_shape: |
    enum class LayoutTransitionKind { initialize, migrate };

    struct LayoutMove {
        std::string operation_id;
        std::string owner_kind;
        std::filesystem::path source;
        std::filesystem::path destination;
        std::string expected_identity_sha256;
    };

    struct LayoutReceiptRewrite {
        std::string component_id;
        std::string prior_receipt_sha256;
        nlohmann::json next_receipt;
    };

    struct LayoutTransitionPlan {
        std::string schema = "arena_install_layout_transition_v1";
        LayoutTransitionKind kind;
        std::string installation_id;
        std::uint64_t prior_generation;
        std::uint64_t next_generation;
        std::optional<std::string> prior_policy_sha256;
        std::optional<std::string> prior_descriptor_sha256;
        std::string target_policy_sha256;
        InstalledLayout target;
        std::vector<LayoutMove> owned_moves;
        std::vector<LayoutReceiptRewrite> receipt_rewrites;
        std::optional<InstallLayoutLocatorRecord> prior_locator;
        InstallLayoutLocatorRecord next_locator;
        std::vector<std::filesystem::path> cleanup_candidates;
    };
  planner_rules:
    - initialize transitions generation 0 to 1 with a new installation id and absent policy, descriptor, and locator preconditions
    - migrate preserves installation id and increments generation by exactly one
    - target component root is install/components/<id>/<version>
    - target managed workspace is workspace/<manifest workspace_name>
    - each move binds exact receipt or manifest ownership and has a deterministic operation id
    - no duplicate destination, overlap, broad recursive root move, or mechanism assumption
    - external, user, and preserved paths are excluded from owned moves
    - receipt rewrites contain only exact path and generation changes required by owned moves
    - prior_locator is exact or absent and becomes the registry effect precondition
    - next_locator exactly matches target policy, descriptor digest, installation id, generation, integration root, and setup path
    - cleanup candidates are non-authoritative empty legacy directories only
    - planner performs no filesystem, registry, service, provider, publication, or transaction mutation
  issue_9_boundary:
    - issue #9 acquires one scope mutation lease and journals every effect
    - issue #9 selects stage, copy, verification, and activation mechanisms, including cross-volume handling
    - issue #9 publishes policy, receipts, and descriptor through issue #7
    - issue #9 applies the locator as one exact conditional typed Windows effect using prior_locator as precondition
    - registry write result must distinguish applied, not_applied, and indeterminate; it may not overwrite stale or foreign locator state
    - before commit_decided every move, receipt, policy, descriptor, and locator effect is compensatable and prior authority remains recoverable
    - after commit_decided cleanup is exact, retryable, and non-authoritative
    - issue #80 never creates another journal, lease, commit point, or recovery engine
  dependency_cycle_resolution: >
    Issue #9 implementation may begin after IL-02 and IL-05 freeze the layout
    types and transition semantics. Issue #80 final acceptance waits for issue #9
    execution, but issue #9 does not wait for a separate layout transaction
    implementation.

normal_lifecycle:
  clean_install:
    - MSI installs stable integration binaries, runtime, and scope marker only
    - suite media supplies the exact target policy to new arena-setup
    - issue #9 initialization publishes policy snapshot, generation-1 descriptor, and locator with component installation
    - failure rolls stable and transaction state back truthfully
  normal_update_repair_uninstall:
    - locate exact registry record
    - exact-read policy and descriptor by digest-bound pointers
    - validate installation id, generation, scope, roots, and stable paths
    - derive SetupPaths only from descriptor
    - execute lifecycle under its existing owner
    - never reconstruct current defaults
  legacy_upgrade:
    - one explicit full integration-protocol upgrade observes legacy state and builds a target transition plan
    - issue #9 migrates before descriptor-authoritative status
    - future package-only updates require descriptor and locator
  incomplete_state:
    - stable MSI or scope marker without a complete valid locator and descriptor is an incomplete clean install or unmigrated legacy installation
    - normal package update refuses and requests one-time integration upgrade or repair
    - no raw-root fallback

validation:
  policy:
    - active policy accepted
    - invalid scope, anchor, segment, cycle, case collision, overlap, privilege, reserved name, or unknown field rejected
    - exact target roots under synthetic anchors
    - Node, WiX, and C++ golden equality
  descriptor:
    - exact policy, generation, scope, roots, and paths accepted
    - policy digest, id, version, path, and current-default mismatch cases
    - invalid UUID, generation, absolute path, normalization, case alias, overlap, or escape rejected
    - physical substitution through issue #7
  locator:
    - valid HKCU per-user and HKLM per-machine records
    - auto exactly one
    - none, both, wrong hive, partial values, malformed values, contradictory pointers, stale generation, wrong installation id, policy digest mismatch, descriptor digest mismatch, or setup escape rejected
    - conditional locator write rejects stale or foreign prior state and reports indeterminate separately
    - updater contains no environment root formulas
  packaging:
    - MSI and bundle derive identical policy projection
    - one synthetic policy change updates every projection without another root edit
    - legacy packaging files contain no semantic roots
    - MSI repair preserves policy snapshots, descriptor, locator, and transaction-owned payload
  legacy:
    - personal, machine-full, machine-routine-drift, and exact split receipts
    - foreign, duplicate, escaping, linked, modified, or unrecognized state rejected
    - external data preserved
  transition:
    - deterministic initialize and migrate plans
    - exact destinations, receipt rewrites, prior and next locator, generation, and installation id
    - no duplicate, overlap, or broad move
    - issue #9 failure injection around policy, move, receipt, descriptor, locator, and commit
    - repeated recovery and retry
  acceptance:
    - clean per-user and per-machine use one policy, descriptor, and locator
    - package update targets exact descriptor store for both scopes
    - per-machine full install and routine update no longer diverge
    - repository policy N+1 cannot redirect installed policy N
    - explicit migration commits or rolls back under issue #9
    - issues #77 and #79 consume the same locator and descriptor without adding roots

implementation_slices:
  - id: IL-01
    goal: implement Node policy validator, resolver, WiX projection, and active-policy tests
    may_touch:
      - packaging/install-layout.json
      - tools/release/install-layout.mjs
      - tools/release/install-layout.test.mjs
      - package.json
    must_not_touch:
      - C++ runtime
      - packaging consumers
      - locator or transaction
  - id: IL-02
    goal: implement C++ policy and descriptor types, resolution, validation, SetupPaths projection, and fake-anchor tests
    prerequisites: [FI-01, ED-01]
    may_touch:
      - include/arena/ports/install_layout.hpp
      - include/arena/application/installer/install_layout.hpp
      - src/application/installer/install_layout.cpp
      - tests/unit/install_layout_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - Windows native adapter
      - SetupEngine lifecycle
      - packaging
  - id: IL-03
    goal: implement Windows known-folder resolver and digest-bound registry locator reader
    prerequisites: [IL-02, FI-02]
    may_touch:
      - include/arena/platform/install_layout.hpp
      - src/platform/windows/install_layout.cpp
      - tests/unit/install_layout_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - registry mutation
      - packaging
      - publication or transaction
  - id: IL-04
    goal: migrate Windows packaging projections to one policy and stop MSI ownership of semantic layout state
    prerequisite: IL-01
    may_touch:
      - packaging/windows/manager-integration.json
      - packaging/windows/suite-bundle.json
      - tools/release/build-manager-msi.mjs
      - tools/release/build-manager-msi.test.mjs
      - tools/release/build-windows-suite-bundle.mjs
      - tools/release/build-windows-suite-bundle.test.mjs
      - packaging/windows/scope-markers/*
      - package.json
    must_not_touch:
      - arena-setup or updater
      - transaction
      - Manager payload separation
      - bootstrap redesign
  - id: IL-05
    goal: implement pure legacy observation and LayoutTransitionPlan generation including prior and next locator semantics
    prerequisites: [IL-02, FI-02]
    may_touch:
      - include/arena/application/installer/install_layout.hpp
      - src/application/installer/install_layout.cpp
      - tests/unit/install_layout_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - filesystem or registry mutation
      - transaction or SetupEngine apply
  - id: IL-06
    goal: integrate descriptor and locator loading plus descriptor-only packaged update invocation; remove normal raw-root reconstruction
    prerequisites: [IL-02, IL-03, IL-04, FI-02, ED-01]
    may_touch:
      - apps/setup/main.cpp
      - include/arena/application/installer/setup.hpp only for InstalledLayout projection entry
      - packaging/windows/apply-suite-update.ps1
      - tools/release/build-suite-update-package.mjs only for invocation adaptation
      - focused tests
      - CMakeLists.txt
    must_not_touch:
      - policy, descriptor, or locator mutation
      - transaction phases
      - Manager dispatch or bootstrap
    completion_limit: >
      Normal descriptor-authoritative update path is implemented. Incomplete or
      legacy installations request a full integration upgrade. Clean-install
      initialization and migration remain gated on issue #9.
  - id: IL-07
    goal: initialize or migrate policy, descriptor, receipts, owned paths, and conditional locator through issue #9 and complete end-to-end acceptance
    prerequisites: [IL-05, IL-06, issue_9_transaction_coordinator]
    may_touch:
      - exact issue #9 coordinator and effect-adapter files selected by Sol
      - src/application/installer/install_layout.cpp
      - apps/setup/main.cpp
      - tests/unit/install_layout_tests.cpp
      - tests/unit/setup_tests.cpp
      - Windows lifecycle tests
      - CMakeLists.txt
    must_not_touch:
      - create another transaction, journal, lease, or recovery owner
      - Manager or provider repositories
      - release provenance, planning, or bootstrap architecture

delegation_stop_conditions:
  - another semantic root map or registry appears necessary
  - environment or current defaults are proposed as installed authority
  - policy needs WiX or PowerShell syntax
  - active policy snapshot would be MSI-owned or overwritten
  - descriptor cannot use issue #7 exact read and publication
  - locator must become semantic root authority
  - locator cannot carry exact generation and policy or descriptor digests
  - locator mutation cannot use an exact prior-state precondition
  - arbitrary custom path support is required
  - legacy ownership must be inferred from adjacency
  - mutation outside issue #9 is required
  - SetupPaths cannot derive from descriptor without unrelated lifecycle redesign
  - issue #77 or #79 attempts to add roots or another locator
  - native Windows behavior cannot be tested

completion: >
  Issue #80 completes only after IL-01 through IL-07 are integrated; one semantic
  policy owns Windows roots; every installation has one exact versioned policy
  snapshot, descriptor, and digest-bound conditional locator; normal lifecycle
  derives SetupPaths only from them; packaging and updater no longer restate
  roots; legacy divergent stores migrate under issue #9; and issues #77 and #79
  consume the same authority without adding path systems.
