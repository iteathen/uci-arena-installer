meta:
  spec_id: arena_installation_contract_v1
  version: 1
  status: active
  owner: release_engineering

authority:
  suite_release_repository: iteathen/uci-arena-installer
  component_candidate_repositories:
    manager:
      repository: iteathen/uci-arena-manager
      components: [manager.core]
    uci_arena:
      repository: iteathen/UCI_Arena
      components:
        - uci_arena.engine
        - uci_arena_evidence.runtime
        - syzygy.wdl.3-4-5
        - syzygy.dtz.3-4-5
    lichess_bot:
      repository: iteathen/uci-arena-lichess-bot
      components: [lichess.adapter]
    book_forge:
      repository: iteathen/uci-arena-book-forge
      components: [book_forge.service, opening_book.standard]
    evidence_service:
      repository: iteathen/uci-arena-evidence-service
      components: [uci_arena_evidence.service]
  release_steward: "@iteathen"
  official_builder: explicitly_dispatched_protected_installer_release_workflow
  stable_publisher: explicitly_dispatched_installer_release_after_production_environment_approval
  forbidden_release_authorities:
    - manager_runtime_service
    - manager_broker
    - developer_workstation
    - book_forge_runtime
    - evidence_service_runtime
  rules:
    - Provider automation may publish only immutable, attested component candidates.
    - Suite composition pins exact provider, commit, manifest, provenance, and artifact digests.
    - A release steward mirrors only the exact lock-pinned provider artifact,
      result, and Sigstore bundle bytes into a private Installer prerelease.
      The mirror is transport-only, requires no GitHub App key, and never
      replaces original-provider identity or attestation verification.
    - Stable promotion republishes the exact tested candidate bytes and never rebuilds.
    - Build identities never receive private signing keys.
    - Local pre-merge validation and the explicitly dispatched suite release
      always run the lockfile-backed npm audit. Automatic GitHub dependency
      review is disabled with continuous integration; feature availability
      must never create an implicit hosted pull-request job.

signed_provenance:
  repository_visibility: private
  implementation: sigstore_cosign_keyless
  cosign_version: 3.0.6
  cosign_installer_action:
    repository: sigstore/cosign-installer
    commit: 6f9f17788090df1f26f669e9d70d6ae9567deba6
  oidc_issuer: https://token.actions.githubusercontent.com
  provider_candidates:
    predicate_type: https://uci-arena.example/attestations/provider-release-result/v1
    trusted_providers:
      manager:
        repository: iteathen/uci-arena-manager
        workflow: .github/workflows/component-release.yml
        workflow_name: Manager component candidate
      uci_arena:
        repository: iteathen/UCI_Arena
        workflow: .github/workflows/component-release.yml
        workflow_name: Provider component candidate
      lichess_bot:
        repository: iteathen/uci-arena-lichess-bot
        workflow: .github/workflows/component-release.yml
        workflow_name: Lichess Bot component candidate
      book_forge:
        repository: iteathen/uci-arena-book-forge
        workflow: .github/workflows/component-release.yml
        workflow_name: Book Forge component candidate
      evidence_service:
        repository: iteathen/uci-arena-evidence-service
        workflow: .github/workflows/component-release.yml
        workflow_name: Evidence Service component candidate
    lock_fields:
      - provenance_bundle_name
      - provenance_bundle_sha256
      - provenance_certificate_identity
      - provenance_oidc_issuer
      - provenance_workflow_name
      - provenance_workflow_ref
      - provenance_workflow_trigger
    verification:
      - Mirror the exact lock-pinned artifact, provider result, and Sigstore
        bundle from the same immutable private provider release into the
        lock-declared private Installer transport release.
      - Suite CI downloads only those mirrored bytes with its repository
        token, verifies every lock-pinned digest, then verifies the original
        provider identity and attestation. Mirror repository identity grants
        no component authority.
      - Verify all three asset SHA-256 values before interpreting them.
      - Each provider's explicitly dispatched signing job publishes the exact
        verified archive, provider result, and Sigstore bundle directly to its
        private immutable candidate prerelease. Actions artifact storage is not
        part of the candidate transport or authority chain.
      - Cosign verification pins the exact certificate identity, OIDC issuer,
        provider repository, source commit, workflow name, workflow ref,
        workflow trigger, predicate type, and artifact bytes.
      - Official suite locks accept only the trusted provider workflow from
        refs/heads/main with workflow_dispatch. Source-tag candidates may be
        diagnostic provider outputs but have no official suite authority.
      - A local complete-development review build may accept a separately
        generated, non-release-ready review lock only through the explicit
        diagnostic-review mode. Every row remains bound to one exact trusted
        workflow, branch ref, source commit, immutable private release, result,
        artifact, and Sigstore bundle; the certificate identity must derive
        from that exact locked ref.
      - Diagnostic-review acceptance changes only the permitted locked source
        ref. It does not weaken digest, OIDC issuer, workflow, trigger,
        repository, source-commit, predicate, transparency-log, or independent
        DSSE-payload verification, and it can emit only an unsigned suite
        candidate that is ineligible for mirroring or promotion.
      - Independently decode the verified DSSE payload and require exactly one
        subject for the locked artifact digest plus a predicate exactly equal
        to the separately digest-pinned arena_provider_release_result_v1.
      - The signed provider result workflow_identity must name the trusted
        workflow at the lock-pinned ref and one exact run id and attempt.
  private_provider_asset_mirror:
    repository: iteathen/uci-arena-installer
    release_tag: provider-mirror/v<suite_version>
    authority: digest_pinned_transport_only
    creation: node tools/release/mirror-provider-assets.mjs release/catalog.lock.json
    rules:
      - The release remains private and prerelease.
      - Every provider artifact, result, and Sigstore bundle name is globally
        unique within the lock and appears exactly once in the mirror.
      - Mirroring verifies the exact source-release bytes against the reviewed
        lock before upload and never alters, resigns, or repackages them.
      - Suite composition needs only github.token for the Installer repository;
        no cross-repository token, long-lived PAT, App private key, or public
        repository visibility is permitted.
      - A missing, substituted, or mutable mirror asset fails the same digest
        and original-provider provenance gates as direct provider transport.
  managed_candidates:
    predicate_type: https://uci-arena.example/attestations/managed-component-release-result/v1
    release_authority: installer_managed_component_only
    suite_installer_authority: iteathen/uci-arena-installer
    trusted_repository: iteathen/uci-arena-installer
    trusted_workflow: .github/workflows/managed-component-release.yml
    trusted_workflow_name: Managed component candidate
    lock_fields:
      - managed_release_tag
      - managed_result_name
      - managed_result_sha256
      - provenance_bundle_name
      - provenance_bundle_sha256
      - provenance_certificate_identity
      - provenance_oidc_issuer
      - provenance_workflow_name
      - provenance_workflow_ref
      - provenance_workflow_trigger
    verification:
      - Managed Node.js and Stockfish payloads are private immutable prerelease
        candidates and are never accepted from mutable public download URLs.
      - Their builder, pinned upstream inputs, native smoke evidence, and
        keyless provenance workflow are Installer-owned and never depend on a
        Manager source or build tree.
      - Download the exact lock-pinned archive, managed result, and Sigstore
        bundle from the same immutable private Installer release.
      - Verify all three asset SHA-256 values before interpreting them.
      - Cosign verification pins the exact certificate identity, OIDC issuer,
        Installer repository, source commit, workflow name, workflow ref,
        workflow trigger, predicate type, and artifact bytes.
      - Official suite locks accept only the trusted managed-component workflow
        from refs/heads/main with workflow_dispatch.
      - Independently decode the verified DSSE payload and require exactly one
        subject for the locked archive digest plus a predicate exactly equal
        to the separately digest-pinned arena_managed_component_release_result_v1.
      - The managed result binds every exact upstream input URL and full
        SHA-256, including the Stockfish evaluation network, plus component
        manifest and license digests, native executable smoke evidence, and
        one exact workflow run id and attempt.
      - Stockfish compilation prepositions the full-digest-verified evaluation
        network and never lets the upstream Makefile perform its insecure
        network fallback.
      - Stockfish results and locks retain an HTTPS source offer for the exact
        corresponding source version.
      - Managed component versions preserve the upstream identity exactly and
        accept two- or three-part numeric versions; Stockfish 15.1 must not be
        relabeled as 15.1.0.
      - The managed Stockfish manifest declares its `uci_engine` discovery
        role through the `stockfish` entrypoint. The private Node runtime
        declares no engine role; capability, component identity, filename, and
        entrypoint names never substitute for the discovery declaration.
  suite_artifacts:
    predicate_type: https://uci-arena.example/attestations/installer-release/v1
    statement_type: https://in-toto.io/Statement/v1
    workflow: .github/workflows/release.yml
    rules:
      - Official suite-installer provenance is issued only by release.yml at
        refs/heads/main through workflow_dispatch.
      - Every Manager artifact is accepted only as an immutable, attested
        manager.core provider candidate; the installer never builds Manager
        from its source tree.
      - Final publication signs one exact multi-subject statement covering
        every accepted installer, payload, catalog, TUF metadata file, and
        detached signature before GitHub release creation.
      - The signing workflow immediately verifies its certificate identity,
        issuer, repository, commit, workflow name, ref, trigger, predicate
        type, one exact subject, and the complete signed statement payload.
  fail_closed_rules:
    - Transparency-log inclusion, certificate-chain and signed-certificate
      timestamp verification, claim checking, and exact predicate checking are
      mandatory. Ignore-log, ignore-certificate, ignore-claim, ignore-SCT, and
      unsigned fallback modes are forbidden in release workflows.
    - Signing, transparency-log, download, digest, bundle, claim, or predicate
      failure blocks composition or publication. Repository visibility is
      never weakened to satisfy an attestation storage service.

interfaces:
  product_composition: arena_product_composition_v1
  catalog: arena_install_catalog_v1
  component: arena_install_component_v1
  standalone_service_contract: uci_arena_standalone_service_contract_v1
  provider_service_contract: uci_arena_service_contract_v1
  provider_installer_integration: arena_provider_installer_integration_v1
  provider_startup_control:
    - arena_provider_startup_control_v1
    - arena_provider_startup_control_v2
  provider_install_context: arena_provider_install_context_v1
  provider_install_result: arena_provider_install_result_v1
  provider_result: arena_provider_release_result_v1
  plan: arena_install_plan_v1
  receipt: arena_install_receipt_v1
  transaction: arena_install_transaction_v1
  release_lock: [arena_suite_release_lock_v1, arena_suite_release_lock_v2]
  schema_compatibility: reject_unknown_major_accept_additive_minor
  manager_service_api: uci_arena_manager_service_api_v1
  service_output: uci_arena_service_output_v1
  installer_options: arena_installation_options_v1
  environment_snapshot: arena_install_environment_snapshot_v1
  installation_snapshot: arena_installation_snapshot_v1
  validation_result: arena_install_validation_result_v1
  deployment_result: arena_install_deployment_result_v1
  rollback_result: arena_install_rollback_result_v1
  installer_result: arena_installer_result_v1
  windows_launcher_envelope: arena_windows_installer_envelope_v1
  uninstall_plan: arena_install_uninstall_plan_v1
  uninstall_preservation: arena_install_uninstall_preservation_v1
  purge_plan: arena_install_purge_plan_v1

installer_lego_architecture:
  status: required
  principle: >
    The installer is an assembly of coherent owners connected by versioned
    contracts. Foreseeable package, layout, dependency, validation,
    preservation, and upgrade changes modify one manifest, policy, validator,
    or adapter rather than the stable orchestration lifecycle.
  component_owners:
    launcher:
      owns: [scope_selection, child_bundle_location, argument_forwarding, exit_code_forwarding, log_location_projection]
      must_not_own: [package_extraction, upgrade_policy, backup, migration, validation, rollback]
    orchestrator:
      owns: [stable_lifecycle, component_coordination, structured_result]
      must_not_own: [component_file_lists, version_specific_rules, machine_specific_commands]
    package_source:
      owns: [catalog_resolution, offline_or_online_transport, digest_verified_bytes]
    windows_child_bundle_source:
      owns: [versioned_envelope, embedded_fixed_scope_bundle_bytes, digest_validation, temporary_child_materialization, cleanup]
      must_not_own: [component_extraction, installation_policy, migration, rollback]
    manifest_loader:
      owns: [schema_validation, component_identity, paths, entrypoints, prerequisites, health_checks]
    configuration_loader:
      owns: [operator_options, environment_overrides, normalized_explicit_roots, precedence]
    environment_detector:
      owns: [platform, privilege, volumes, locks, runtimes, ports]
    installation_state_detector:
      owns: [evidence_collection, state_classification_inputs]
      must_not_own: [upgrade_or_repair_policy]
    planner:
      owns: [mode_selection, policy_evaluation, ordered_typed_operations, capacity_plan]
      must_not_own: [filesystem_mutation, process_control]
    staging_manager:
      owns: [isolated_staging, staged_content_identity, staging_cleanup]
    deployment_adapter:
      owns: [atomic_activation, replaceable_file_operations, platform_path_semantics]
    dependency_adapter:
      owns: [external_runtime_and_platform_operations, typed_argument_arrays]
    configuration_migrator:
      owns: [versioned_idempotent_migrations, migration_receipts]
    preservation_manager:
      owns: [ownership_classification, preserved_data_plan, preservation_evidence]
    removal_lifecycle:
      owns: [uninstall_plan_projection, uninstall_commit, purge_plan_projection, purge_commit]
      receives: [normalized_roots, exact_receipt_or_preservation_evidence, startup_adapter_hooks]
      must_not_own: [provider_startup_implementation, provider_identity_rules, external_file_deletion]
    validators:
      owns: [independent_named_checks, structured_observations, remediation]
    backup_manager:
      owns: [backup_creation, identity, retention]
    rollback_manager:
      owns: [prior_state_restoration, rollback_result_distinct_from_original_failure]
    logging_provider:
      owns: [structured_redacted_run_log, operation_and_result_correlation]
    result_reporter:
      owns: [stable_exit_category, bounded_machine_result, operator_remediation]
  rules:
    - Components receive dependencies explicitly and exchange only the declared
      versioned structures; mutable installer globals are forbidden.
    - Platform commands, registry access, service control, archive tools, and
      process management remain behind adapters and accept no shell strings.
    - Abstraction is required only at coherent ownership, change-pressure,
      platform, recovery, or independent-test boundaries; wrappers around
      basic path or filesystem operations are forbidden.
    - Package knowledge lives in catalog, component manifests, configuration,
      and policy. A normal release does not change orchestration control flow.
  lifecycle:
    - parse_invocation
    - load_configuration
    - load_and_validate_manifest
    - inspect_environment
    - detect_installation_state
    - build_plan
    - report_plan
    - validate_release_media_retention
    - stage
    - validate_stage
    - backup_when_required
    - apply_plan
    - validate_installation
    - commit
    - rollback_on_critical_failure
    - report_structured_result
  installation_states:
    - absent
    - current_valid
    - older_valid
    - newer_valid
    - unsupported
    - partial
    - corrupt
    - interrupted
    - staged_uncommitted
    - locked
    - development_workspace
    - repair_required
  modes: [clean_install, upgrade, repair, reinstall, downgrade, replacement, uninstall, purge]
  partial_installation_rules:
    - A selected immutable component root without a matching validated active
      receipt is partial installation state, not installed authority.
    - Clean-install planning reports that state as a repair-required blocker
      before staging or mutating any selected component.
    - Explicit repair may restage and replace the partial immutable root while
      preserving provider workspaces, knowledge, locators, and external files.
    - Rollback retries removal or restoration of managed immutable roots and
      records rollback_failed when cleanup cannot be completed; it must not
      report rolled_back while an untracked replacement root remains.
  ownership_classes:
    - application_replaceable
    - user_preserved
    - generated
    - migrated
    - cache_disposable
    - installer_temporary
    - external_dependency
    - unknown_policy_controlled
  stable_exit_categories:
    success: 0
    invalid_invocation: 2
    invalid_manifest: 3
    invalid_configuration: 4
    failed_preflight: 5
    unsupported_state: 6
    package_validation_failed: 7
    dependency_failed: 8
    locked_files: 9
    staging_failed: 10
    deployment_failed: 11
    post_install_validation_failed: 12
    rollback_failed: 13
    internal_failure: 14
    operator_cancelled: 15
  documentation_root: docs/installer

standalone_service_contracts:
  applicability: >
    Any component declaring manager_integration_api is an integrated Manager
    service and must name its service contract. Installer integration alone
    may belong to a non-service configuration consumer and does not imply a
    service contract.
  compatibility: >
    Contract requirements derive only from declared integration roles. The
    Installer must not select them from component ids, repository identities,
    or historical version thresholds.
  validation:
    - The contract path is a safe relative path to a regular, non-symbolic-link
      file listed with its exact size and SHA-256 in arena-component.json.
    - Contract schema, component id, and component version match the installed
      component manifest exactly.
    - The contract CLI entrypoint equals the component's declared cli
      entrypoint and names a digest-verified payload file.
    - Contract capabilities and data paths exactly match their component
      manifest projections; duplicate or non-string values are rejected.
    - Configuration and status schemas are explicit stable identifiers.
    - Startup ownership exactly matches the component manifest, and the health
      smoke is the public status command with exit-zero plus schema validation.
    - Upgrade preserves and migrates service data, while repair and normal
      uninstall preserve it.
    - When either the standalone service contract or arena-component.json
      contains manager_integration_api, both contain the same declaration.
    - The declaration uses uci_arena_manager_service_api_v1 version 1.x over
      CLI JSON, selects the verified cli entrypoint with the argv prefix
      [api], declares all five required operations as a subset, and emits only
      uci_arena_service_output_v1 output records. Additional unique typed
      operation identifiers are permitted so service-owned capabilities can
      extend the API without weakening the required common surface.
    - Manager service API metadata is covered by the immutable component
      manifest and provider attestation; installer or Manager code never
      synthesizes it for an installed provider.
    - Verify invokes a Manager-integrated service's declared dependency
      runtime, CLI entrypoint, fixed Manager API argument prefix, status
      operation, bounded provider workspace argument, and the declared
      configuration argument when the validated receipt owns a generated
      configuration. It accepts only an exit-zero
      uci_arena_manager_service_api_v1 envelope with the exact
      compatible API major, component id, component version, status operation,
      ok true, and payload status schema declared by the validated contract.
    - A standalone service without Manager integration is verified through its
      declared health_smoke command and status schema. Startup install and
      uninstall actions are lifecycle mutation contracts and are never
      extended or guessed to perform health inspection.
  receipt:
    fields:
      - schema
      - path
      - sha256
      - configuration_schema
      - status_schema
      - manager_integration_api
    rules:
      - Apply records the exact validated contract evidence in the component receipt.
      - Verify recomputes contract evidence from the immutable active root and
        rejects a missing, stale, or fabricated receipt projection.
      - Manager consumes only the installed contract and public service
        entrypoints; it never imports provider source or service-owned storage.

provider_service_contracts:
  components:
    - lichess.adapter
  accepted_schema: uci_arena_service_contract_v1
  required_for_new_provider_candidates: true
  legacy_compatibility: >
    Already-installed engine-embedded Lichess 1.0 payloads without this public
    contract remain readable for verification, repair, and removal. New
    candidates from the standalone provider repository fail release assembly
    unless the contract is present and validated.
  validation:
    - The service identity and exact component version match arena-component.json.
    - Provider workspace names and configuration-template paths are manifest
      data. A new provider does not add a workspace-name or source-layout
      branch to the transaction engine.
    - The declared CLI entrypoint, service contract, Manager operation catalog,
      configuration schema, configuration-update schema, and status schema are
      safe relative regular files listed by exact size and SHA-256 in the
      component manifest.
    - The service contract uses CLI JSON transport, publishes bounded typed
      errors, preserves provider-owned data for upgrade, repair, and normal
      uninstall, and declares credential-gated startup explicitly.
    - The service contract declares direct execution or one dependency-runtime
      component plus its named entrypoint. A dependency runtime must also be a
      component-manifest dependency; Installer and Manager never infer an
      interpreter from a filename, component id, or source layout.
    - The Manager operation catalog is a closed versioned object containing
      fixed argument arrays; it cannot name an executable, working directory,
      shell string, token value, or provider-private storage path.
    - Installer records only the exact contract paths, schemas, digests,
      operation-catalog identity, and credential gate in the receipt. It never
      synthesizes provider operations or reads a credential.
    - An unknown contract major, missing referenced contract, unlisted file,
      identity drift, unsafe path, or digest mismatch fails before mutation.
  receipt:
    schema: uci_arena_service_contract_v1
    fields:
      - path
      - sha256
      - configuration_schema_path
      - configuration_schema_sha256
      - configuration_update_schema_path
      - configuration_update_schema_sha256
      - status_schema_path
      - status_schema_sha256
      - manager_operations_path
      - manager_operations_sha256
      - credential_gated_startup

provider_installer_integration:
  owner: installable_provider
  consumer: uci_arena_installer
  purpose: >
    A provider translates declared suite dependency and saved-locator bindings
    into its own configuration and bounded generated documents. Installer owns
    validation, invocation, journaling, placement, verification, and rollback,
    but it does not interpret provider configuration fields or identities.
  contract:
    schema: arena_provider_installer_integration_v1
    version: 1
    invocation: dependency_runtime_with_fixed_argument_array
    context_schema: arena_provider_install_context_v1
    result_schema: arena_provider_install_result_v1
    workspace_output_limit: 16
    dependency_binding_limit: 32
    locator_binding_limit: 32
  requirements:
    - The provider manifest names one digest-verified renderer entrypoint and
      its declared dependency runtime; Installer never selects an interpreter
      from a suffix, source layout, or provider id.
    - A manifest that declares installer integration also declares the same
      workspace_name at the component root. Release assembly rejects a missing
      or divergent projection before catalog generation, and runtime payload
      validation independently enforces the same invariant before mutation.
    - A provider installer integration may declare workspace_placement as
      workspace_root or product_data. Omission retains workspace_root for v1
      compatibility. product_data resolves beneath the mutable Installer data
      root at provider-data/<workspace_name>; it never resolves beneath an
      immutable component or program root.
    - Dependency inputs are explicit receipt-verified active roots,
      entrypoints, or safe component-relative paths. Required bindings fail
      closed; unavailable optional bindings are omitted.
    - Locator subscriptions are named and typed. Each binding may declare the
      accepted authority sources saved_locator and install_receipt. An omitted
      source declaration preserves the v1 saved-then-receipt behavior for
      existing manifests. Saving a locator refreshes only installed consumers
      that declare that kind, without provider-id branches.
    - Installer supplies a locator only from a source accepted by that binding.
      In particular, a receipt-owned suite default is not presented through a
      saved-locator-only override binding merely because both use the same
      discovery kind. Selection remains data-driven and never branches on a
      provider or component identity.
    - Context contains component identity, immutable active root, provider
      workspace, enablement, declared bindings, and validated locator paths.
      Credential contents never enter context, argv, logs, receipts, or output.
    - Renderer output is a closed versioned object containing one configuration
      object and at most sixteen safe workspace-relative JSON documents.
    - Installer writes configuration and generated documents atomically,
      records every mutation in the transaction journal, restores prior files
      in reverse order on failure, and removes temporary context plus backups.
    - Verification reruns the same provider renderer through the declared
      contract and compares every generated document; retained state is not
      trusted merely because it exists.
    - Adding or changing provider configuration normally changes only the
      provider renderer and manifest bindings, not Installer control flow.
    - The contract is capability-neutral: an Engine component may use the same
      renderer boundary to publish arena_uci_engine_launch_profile_v1. Engine
      owns translation of timing, search, model, and knowledge contracts into
      UCI options; Installer supplies only declared receipt and locator paths,
      writes the result transactionally, and records its preserved workspace.
    - Adding or changing an Engine launch option, default topology, timing
      calibration field, or knowledge binding changes the Engine artifact and
      manifest data. It must not introduce an Engine-id or UCI-option branch in
      Installer planning, deployment, verification, repair, or rollback.
    - A startup-capable provider declares arena_provider_startup_control_v1
      beside its renderer: exact entrypoint, fixed install/uninstall argument
      arrays, workspace/configuration flags, result envelope, and required
      configuration-match/live evidence. Installer never guesses these values
      from component identity, entrypoint names, or implementation language.
    - Startup-control v2 adds required pre_replace and post_replace actions plus
      exact previous-root and replacement-root flags. Before replacing any
      component root, Installer stages and validates the complete transaction,
      finds every installed live startup consumer whose own root or declared
      dependency root will change, and quiesces those consumers in reverse
      dependency order. A replaced v2 consumer uses pre_replace from its
      validated staged payload against the exact prior receipt-owned workspace;
      an affected v1 consumer uses its declared installed uninstall action.
      No component root is renamed until every affected consumer proves inactive.
      The provider stops and retargets its existing credential-bearing startup
      registration without opening or copying credential contents.
    - A successful pre_replace response proves the registration remains
      installed, is inactive, and is replacement-ready. Installer defers every
      affected consumer restart until all component roots, receipts, and
      configurations are committed, then resumes consumers in dependency order.
      A replaced v2 consumer uses post_replace from the installed replacement and
      requires the declared live result. It journals every transaction-wide
      transition and never invokes the older payload's uninstall action for that
      v2 replacement.
    - Rollback first stops any consumer already resumed against replacement
      roots, restores files and receipts, then restores every prior startup
      registration in dependency order. V1 remains accepted and is quiesced
      transaction-wide whenever its declared dependency root changes.
    - A startup-control workspace relative path of `.` denotes the provider
      workspace itself; another safe relative path denotes one of its
      descendants. Installer accepts exactly those two bounded shapes, rejects
      traversal outside the provider workspace, and rejects symbolic-link or
      reparse traversal before invoking the provider adapter.
    - Credential-gated startup installation remains provider/operator work;
      Installer does not receive credential contents. Credential-free startup
      removal remains declared so normal uninstall can remove startup authority
      even when Installer did not create it.
    - Absence of Installer-owned startup state in a receipt is not evidence that
      an operator-managed credential-gated startup registration is inactive.
      Before replacing the component or one of its declared dependency roots,
      Installer conservatively quiesces every installed credential-gated,
      startup-capable receipt through its declared control contract unless
      authoritative inactive state is available; it never discovers the
      registration by product identity.

setup:
  executable: arena-setup
  operations: [inventory, import, plan, apply, verify, repair, upgrade, uninstall-plan, uninstall, purge-plan, purge]
  presets: [complete_arena, manager_only, custom]
  machine_output: json
  elevated_result_handoff:
    option: --result-file
    owner: native_desktop_setup_helper
    requirements:
      - The helper creates the exact private temporary path and the React
        caller cannot supply or observe a different destination.
      - Success and structured failure write one bounded JSON document before
        process exit so an elevated Windows commit never requires shell
        redirection or stdout capture.
      - The helper removes the result file after one bounded read.
  linux_noninteractive: [yes, offline]
  discovery_is_read_only: true
  apply_requires_explicit_confirmation: true
  elevation: commit_phase_only
  broker_dependency: false
  self_update: false
  selectable_components:
    windows_ui: installer_modify_feature_selection
    linux_ui: package_or_arena_setup_component_selection
    default_on:
      - uci_arena.engine
      - book_forge.service
      - uci_arena_evidence.service
      - lichess.adapter
    rules:
      - The catalog owns a feature-selection contract containing one base
        preset, the exact operator-visible feature component ids, and their
        default selections. The setup executable derives dependency closure
        and removal candidates from that data; it contains no compiled list of
        UCI Arena product component ids.
      - Feature reconciliation never removes a base-preset component or a
        component still in the selected dependency closure. Unknown feature
        assignments fail before mutation.
      - Initial Windows installation presents the named suite components as
        selected by default and permits the operator to clear any optional
        component before commit.
      - Apps and Features Modify reopens the same selection surface. Adding or
        removing a selection invokes arena-setup apply or uninstall; it never
        edits immutable component roots directly.
      - Upgrade carries the installed selection forward, restages every
        selected component from the new signed catalog, and does not silently
        reinstall a component the operator previously removed.
      - Upgrade preserves the exact workspace recorded by a validated existing
        provider receipt while stopping or restoring that receipt's startup
        registration. If the replacement manifest changes the declared
        workspace placement, Installer then migrates that exact stopped
        receipt-owned directory to the new declared path by a same-volume
        atomic rename before rendering replacement configuration.
      - Workspace migration rejects links, an occupied destination, an
        unverified receipt/configuration relationship, and cross-volume moves.
        After provider startup removal, the same-volume atomic rename tolerates
        only bounded operating-system handle teardown through retry and fails
        closed into the journaled rollback path when that bound is exhausted.
        It journals the directory move, rebases only saved locators whose
        validated paths are descendants of that exact workspace, regenerates
        every declared consumer, and reverses locator and directory changes
        before restoring prior startup on any failure.
      - The narrow migration authority never authorizes a browser, catalog, or
        new component to select an arbitrary outside-root path. A workspace
        that is not the exact validated receipt data path remains external and
        unchanged.
      - Linux packages carry arena-setup, the retained signed catalog, and
        lifecycle integration; distro-native service scripts and arena-setup
        provide equivalent component install, repair, upgrade, and removal.
      - Component changes stop affected provider startup registrations before
        payload replacement, stop Manager only for the bounded receipt/config
        commit window, then restart and verify every service selected to run.
      - Each apply and uninstall operation is independently transactional.
        Selection reconciliation keeps Manager stopped across the bounded
        sequence, restores its prior running/stopped state on success or a
        component-operation error, and never reports a failed transition as
        complete.

packaging:
  windows_sources: packaging/windows
  linux_sources: packaging/linux
  windows_outputs: dist/windows
  linux_outputs: dist/linux
  clean_build:
    authority: iteathen/uci-arena-installer
    suite_command: protected .github/workflows/release.yml workflow_dispatch
    local_complete_candidate_command: >
      node tools/release/clean-build.mjs --complete-development
      --platform <target>
    manager_component_command: >
      acquire one immutable attested manager.core candidate for <target>
    output_manifest:
      schema: arena_clean_build_result_v1
      filename: clean-build-result.json
      binds:
        - suite_version
        - source_commit
        - target_platform
        - build_preset
        - composition_sha256
        - release_lock_sha256
        - exact_component_input_digests
        - exact_component_source_commits_and_workflow_refs
        - exact_artifact_names
        - artifact_sizes
        - artifact_sha256_digests
    source_requirement: clean_tracked_worktree
    behavior:
      - Run specification and model/product naming gates before compilation.
      - Automatic GitHub Actions validation is disabled for pull requests,
        pushes, merge queues, and schedules in every private UCI Arena
        repository. Required checks run locally before a pull request is
        merged, and the pull request records the exact commands and outcomes.
      - Release and provenance workflows are separate from continuous
        integration. They accept workflow_dispatch only, run solely after an
        explicit operator request, and are never configured as automatically
        required pull-request status checks.
      - Acquire and verify one immutable Manager component candidate and one
        Installer runtime candidate per target. Platform integration overlays
        are Installer-owned data applied only after both manifests validate.
      - Windows package generation uses pinned WiX over the same validated
        Manager and Installer runtime roots for both fixed scopes. Linux package
        generation uses distro adapters over the same validated Manager root
        plus Installer-owned integration policy; neither path reads a Manager
        source or build tree.
      - Complete development composition resolves the pinned Cosign verifier
        from an explicit COSIGN_EXECUTABLE, then the exact repository-local
        build/tooling/cosign-3.0.6 payload, then PATH. Missing verification
        tooling or any provenance failure remains blocking.
      - Linux portable-media construction receives trust mode and transport
        mode as explicit release-assembly inputs. Development launchers pass
        --allow-unsigned-development-catalog and never pretend to carry TUF;
        official launchers require release/tuf/root.json and pass
        --metadata-dir. Offline launchers additionally pass --offline, while
        online launchers do not.
      - Pull-request CI and the protected suite release workflow install the
        same explicit Linux native-build prerequisite set before vcpkg
        dependency bootstrap. Release-only package validators may extend that
        set, but they never replace it or run after dependency bootstrap.
      - Linux release packages pass blocking lintian, rpmlint, and systemd unit
        validation before provenance is issued. Maintainer scripts are
        executable, package metadata is policy-valid, release binaries are
        stripped, public manual pages and the changelog are reproducibly
        compressed, and copyright plus bundled-dependency license evidence is
        installed with the package.
      - A Lintian override is allowed only for one exact documented occurrence
        that follows from the standalone distribution contract: reviewed
        static dependency linkage in a named executable, or the absence of a
        public manual page for a named internal service, broker, or desktop
        launcher. Broad tag suppression and validator failure masking are
        forbidden.
      - A successful build emits a digest-bound
        arena_clean_build_result_v1 manifest and cannot succeed when any
        required installer is missing, empty, ambiguously named, or accompanied
        by stale installer output.
      - The result distinguishes release_ready_lock from
        diagnostic_review_lock input authority and records every composed
        component repository, version, target, source commit, workflow ref,
        artifact digest, result digest, and Sigstore-bundle digest.
      - Manager publishes one immutable, manifest-bound component candidate per
        target. Installer release assembly consumes that candidate through the
        same component contract locally and in protected CI; it never reads a
        Manager source checkout or mistakes the candidate for Complete Arena
        media.
      - The explicit --complete-development path composes only the
        release-ready digest-pinned lock and its verified provider Sigstore
        bundles. It may emit an unsigned development bootstrapper, but it
        cannot bypass provider attestation verification, synthesize a
        component, accept an unreviewed source checkout, or label the result
        official.
      - Before merge, the additional explicit --diagnostic-review-lock path
        may compose one complete target-specific non-release-ready lock from
        immutable private branch candidates. It validates the same component,
        dependency, manifest, digest, and provenance contracts as the normal
        complete-development path, records unsigned_suite_candidate, and is
        rejected by protected release, provider mirroring, and suite signing.
      - Diagnostic review acquisition consumes a declarative source set with
        exactly one component id, private repository, immutable prerelease tag,
        and exact release-target commit for every composed component. The
        package-source adapter downloads exactly the artifact, release result,
        and Sigstore bundle into a fresh bounded root, derives the review lock
        from those bytes, and publishes neither the lock nor the candidates.
      - A Complete development bootstrapper enables MSI same-version upgrades
        so a newer source commit can repair or replace an installed candidate
        that has the same unreleased suite version. Manager-only and official
        release builds default to rejecting same-version replacement; the
        development flag is explicit in the clean-build composition path and
        never changes downgrade protection.
      - The Complete development bootstrapper uses the upgrade transaction for
        both initial installation and related-bundle replacement. With no
        receipts the upgrade transaction installs normally; with existing
        receipts it restages every selected component, regenerates integration
        configuration, reapplies managed workspace access, and adopts the
        receipts before the related older bundle is removed.
      - When that bootstrapper's initial elevated transaction explicitly
        accepts an unsigned development catalog, retained release media records
        the exact catalog digest in the same administrator-protected release
        directory. Later plan, Modify, repair, and component-install actions may
        reuse only that exact retained catalog and digest marker; the marker
        cannot authorize external media, a changed catalog, or an official
        release without TUF metadata.
      - A Windows complete development build emits both fixed-scope Manager
        MSIs and the default-on online and offline UCI Arena Suite Setup
        executables for both scopes. The
        bootstrapper contains or can acquire UCI Arena Engine, private Node,
        Stockfish, Book Forge, standard opening book, Evidence runtime,
        Evidence Service, and the Lichess adapter according to the exact
        reviewed catalog.
      - The Windows feature surface exposes the packaged standard opening book
        as its own default-selected knowledge component. Selecting Book Forge
        does not silently stand in for selecting a published book artifact.
      - The protected Installer workflow is the canonical complete clean build.
        It requires a release-ready lock, acquires immutable Manager and provider
        candidates for both platforms, validates their manifests and provenance,
        runs the acceptance gates, and emits the complete installer sets from
        the accepted bytes.
      - Provider artifacts from every lock-allowlisted private repository
        remain immutable component candidates. They never satisfy or replace a
        suite installer artifact.
      - Unsigned local artifacts are development installers, not official
        releases. Signing, stable promotion, and protected acceptance remain
        protected-CI-only operations over the exact accepted bytes.
      - A non-publishing Suite release run may build and attest development
        Manager candidates without an offline TUF root configured. A
        publishing run must provide and embed the exact TUF_ROOT_SHA256 before
        compilation; an empty or synthetic production trust root is forbidden.
    required_outputs:
      windows-x86_64:
        - UCI-Arena-Setup-<version>-windows-x64-online.exe
        - UCI-Arena-Setup-<version>-windows-x64-offline.exe
        - UCI-Arena-Manager-<version>-windows-x64-user.msi
        - UCI-Arena-Manager-<version>-windows-x64-machine.msi
      linux-x86_64:
        - uci-arena-setup-<version>-linux-x86_64-online.run
        - uci-arena-setup-<version>-linux-x86_64-offline.run
        - uci-arena-manager_<version>_amd64.deb
        - uci-arena-manager-<version>-1.x86_64.rpm
        - uci-arena-manager-<version>-linux-x86_64.tar.gz
    manager_component_outputs:
      windows-x86_64:
        - manager.core-<version>-windows-x86_64.tar.gz
      linux-x86_64:
        - manager.core-<version>-linux-x86_64.tar.gz
  routine_component_update:
    owner: uci_arena_installer_release_tooling
    command: >
      node tools/release/build-suite-update-package.mjs --component <id>
      --platform windows-x86_64 --lock <reviewed-lock> --asset-root <assets>
    outputs:
      - deterministic_suite_update_archive
      - digest_bound_suite_update_result
      - fixed_apply_update_script
      - exact_catalog_and_component_payloads
    rules:
      - A provider, Engine payload, knowledge, or other ordinary component
        release does not configure, compile, test, or recompose native
        Installer, Manager MSI, Burn bundle, or launcher sources.
      - Package construction runs every lock, composition, source-commit,
        manifest, version, artifact, and provenance check before writing the
        update archive. A failed cheap check cannot start a native build.
      - The fixed deployment script verifies its own package manifest and the
        installed arena-setup runtime version before invoking one typed custom
        upgrade transaction for the declared component roots and dependency
        closure. It never accepts an executable or arbitrary command from the
        package manifest.
      - Archive payloads equal the selected component dependency closure
        exactly. The suite catalog may describe other composed components, but
        their bytes are absent; manager.core can never enter a routine package
        unless it is a selected dependency, which is rejected as a full-build
        exception.
      - Official packages require matching signed TUF metadata. Explicit
        diagnostic-review packages remain unsigned development candidates and
        pass the existing narrowly scoped development-catalog flag.
      - Changes to Installer runtime protocol, Manager MSI payload, Burn
        integration, fixed-scope launcher, or trust bootstrap remain explicit
        full-installer-build exceptions. The exception is recorded in the
        update result rather than silently falling back to the heavyweight
        path.
  windows_manager_msi:
    owner: uci-arena-installer
    payload_source: immutable_manager_component_artifact
    integration_policy: packaging/windows/manager-integration.json
    scopes:
      per_user:
        recommended: true
        elevation: forbidden
        program_root: LocalAppData/Programs/UCI Arena Manager
        data_root: LocalAppData/UCI Arena Manager
        path: user_msi_owned
        manager_lifecycle: launcher_started_same_user_process
      per_machine:
        recommended: false
        elevation: required
        program_root: ProgramFiles/UCI Arena Manager
        data_root: ProgramData/UCI Arena Manager
        path: machine_msi_owned
        manager_lifecycle: LocalService_windows_service
    service_registration: installer_owned_declarative_wix_integration_policy
    required_payloads:
      - manager_binaries
      - native_runtime_dependencies
      - dashboard_assets
      - installed_contract_schemas
      - complete_installer_runtime_dependency_closure
    rules:
      - Per-user and per-machine MSIs package one tested native binary set and
        install an MSI-owned share/uci-arena/install-scope.txt marker containing
        exactly per-user or per-machine. Native entry points fail safely to
        per-machine semantics when the marker is absent or invalid. Public and
        private native entrypoints resolve the nearest marker through a bounded
        ancestor search from their own executable directory so the private
        libexec layout cannot silently change Personal roots to machine roots;
        scope is never inferred from a React value or an untrusted catalog.
      - Installer validates every Manager artifact file against its component
        manifest before generating either MSI. The MSI builder overlays only
        manifest-bound Installer runtime files beneath the policy-declared
        private Installer subroot and Installer-owned integration payloads,
        including the fixed-scope marker; it does not infer Manager source-tree
        layout or package a lone arena-setup executable.
      - An Installer-owned adjacent arena-setup launcher preserves Manager's
        stable setup-helper contract while forwarding the exact typed argument
        vector and exit code to the private Installer runtime. The launcher
        owns no package, planning, validation, backup, or rollback behavior.
      - Manager, Installer runtime, launcher, scope-marker, and runtime-manifest
        destinations must be disjoint. Any destination collision fails before
        WiX source or package output is committed; independently owned runtime
        libraries are never silently deduplicated.
      - Per-user MSI generation uses pinned WiX 6 with native per-user package
        scope. Every component installed beneath the user profile has an
        MSI-owned HKCU key path where Windows Installer requires it, and ICE38
        is a blocking validation rather than a suppressed warning.
      - Burn passes the fixed package scope explicitly to arena-setup together
        with every scope-owned root: install, data, cache, and knowledge. The
        provider workspace is not package-scope-owned and retains arena-setup's
        native default unless an operator explicitly selects an override. The
        explicit scope must match the bundle, controls service-account ACL
        behavior, and is preserved for Modify, repair, update, and uninstall.
      - The arena executable directory is added to the PATH matching the
        selected install scope through an MSI-owned Environment row and is
        removed from that same PATH on uninstall. Setup never rewrites
        unrelated PATH entries.
      - Per-user install, Modify, repair, update, and uninstall operate only on
        per-user MSI state, LocalAppData, user PATH, and receipt-owned user
        workspaces. They do not request elevation and never install, control,
        or impersonate a Windows service.
      - The per-user native launcher starts the adjacent verified Manager
        service binary as the interactive user only when the authenticated
        loopback endpoint is unavailable, passes fixed per-user data and
        packaged-dashboard paths, waits for readiness, and never accepts an
        executable or path from React.
      - Per-machine setup owns Program Files, ProgramData, machine PATH, and a
        LocalService Windows service, so install, Modify, update, repair, and
        uninstall truthfully display an elevation shield and may invoke UAC.
      - Code signing can reduce publisher/SmartScreen warnings but cannot and
        must not suppress a legitimate per-machine UAC consent or credential prompt.
      - WiX 6 fixed-scope per-user and per-machine installers are built as
        separate artifacts. A configurable-scope bundle is forbidden until a
        separately reviewed toolchain upgrade supports it without weakening
        licensing, provenance, or reproducibility requirements.
      - Fixed-scope bundle planning is exact-identity idempotent. If the
        platform reports one related bundle registration more than once, the
        bootstrapper adapter retains one execute/rollback plan and requests no
        action for later occurrences of that same bundle code. Detection
        duplication remains observable in the Burn log; it must never produce
        duplicate removal authority, a missing-cache launch, or a success-path
        error dialog.
      - A scope-neutral native launcher may provide one visible Personal or All
        users choice while delegating unchanged to the two fixed-scope bundles.
        It is a launcher brick, not a configurable WiX bundle: it never
        extracts components, evaluates upgrade policy, mutates receipts, or
        implements rollback.
      - The launcher's versioned envelope source embeds the two already-signed
        fixed-scope bundle bytes, validates their exact SHA-256 values before
        selection, materializes only the selected child in a private temporary
        directory, and removes that directory after the child exits. This is
        child-bundle transport, not application component extraction.
      - Release assembly executes each final envelope with the sole
        --validate-envelope operation. That operation validates the complete
        envelope and both embedded payload digests, is non-interactive, and
        exits before installed-state inspection, scope policy, extraction,
        elevation, or mutation. Operator --dry-run --scope planning remains a
        separate environment-sensitive lifecycle check.
      - Online and offline launchers are separate deterministic envelopes.
        Their source bundle filenames and suite version are release-assembly
        inputs and never become control-flow constants in the native launcher.
      - The scope-neutral launcher defaults to Personal, preserves an existing
        installed scope for Modify and update, blocks simultaneous opposite-
        scope Manager authorities, and requires an explicit cross-scope
        uninstall/migration decision. Personal delegation never requests
        elevation; All users delegation truthfully invokes the machine bundle
        and therefore may show UAC.
      - The launcher and both fixed-scope bundles use distinct product/cache
        identities and physical roots. One front door or one documented launch
        path never means that per-user and per-machine deployments share a
        writable install or data directory.
      - An installed scope is preserved by Modify and update. Cross-scope
        migration is explicit and never silently runs one scope over the other.
        Each MSI detects the opposite upgrade identity and blocks a new
        cross-scope installation before two Manager authorities can compete;
        maintenance of an already-installed scope remains available so the
        operator can uninstall it before changing scope.
      - The local installer-cycle runner validates an MSI's fixed-scope
        artifact name for both prepare and adopt, verifies the installed
        MSI-owned scope marker, and proves the running Manager executable
        belongs to the requested install root before recording an adopted
        cycle. A listening endpoint or same-named service alone is not scope
        evidence.
      - The MSI service executable and every required native DLL are installed
        into the same private binary directory before the service is started.
      - The bundle embeds arena-setup with its complete adjacent private
        runtime directory; extracting a lone executable is forbidden.
      - The arena-setup executable package uses no Burn console-redirection
        protocol so inherited standard handles cannot keep the bootstrapper
        blocked after arena-setup exits.
      - Every Burn arena-setup invocation passes an operation-specific sibling
        of its package log path through the typed --result-file option. Install,
        repair, and uninstall use distinct suffixes so rollback cannot overwrite
        the forward operation's bounded JSON result or its actionable setup
        error with a later cleanup result.
      - Install, repair, and uninstall resolve the embedded catalog and TUF
        metadata from the currently executing Burn package cache directory.
        They never depend on the bootstrapper launch directory or a retained
        source-media working directory.
      - The visible bundle and Programs and Features name is UCI Arena Suite
        Setup (per-user) or UCI Arena Suite Setup (all users), matching its
        fixed scope. Online, offline, acceptance, commit, and build identifiers
        remain in artifact names and logs; the visible version is only the
        suite semantic version.
      - The service uses the packaged dashboard path and never a source checkout.
      - The bundle resolves one Manager data root and passes that exact path to
        both the Manager MSI service arguments and every arena-setup operation.
        The installed Manager CLI defaults to the same platform data root.
      - After component receipts and generated configurations commit, the
        Windows bundle requires arena-setup to restart the installed Manager
        service so its first active projection reads the new receipt set.
      - On that restart, Manager refreshes every installed optional service
        through its public status contract even when its immutable component
        digest is unchanged.
      - The suite bundle is the only visible Programs and Features entry.
      - Installing a bare Manager-Core MSI is a developer-only operation. User
        documentation and normal release handoff point to UCI Arena Suite
        Setup so an operator cannot reasonably mistake Manager Core for a
        Complete Arena installation.
      - Bundle uninstall invokes arena-setup suite uninstall before removing
        the Manager MSI so provider startup registrations cannot be stranded.
      - MSI major upgrades require a strictly greater three-field product
        version. Rebuilding different bytes under the same product version is
        not an upgrade path; use the explicit repair lifecycle instead.
      - The bundle feature-selection state is default-on for Engine, Book
        Forge, Evidence Service, and Lichess adapter, is available again from
        Modify, and is preserved across a major upgrade.
      - The bundle does not synthesize a workspace root from Burn shell-folder
        variables. It omits the optional override so arena-setup owns its native
        user-profile default, which is not redirected through Documents or
        OneDrive. Existing receipt-owned workspaces remain authoritative on
        upgrade regardless of that default.
  linux_manager_packages:
    owner: uci-arena-installer
    payload_source: immutable_manager_component_artifact
    integration_policy: packaging/linux/manager-integration.json
    formats: [deb, rpm, tar_gz]
    rules:
      - The package builder validates the complete Manager component manifest
        before staging and never reads a Manager source or build tree.
      - Component bytes are copied without content changes. Distro paths,
        service units, desktop integration, maintainer scripts, package metadata,
        compressed documentation, and output names come from Installer-owned
        policy and adapters.
      - Normal package removal removes package payload and startup authority but
        preserves Manager and provider state. Distro purge hooks also preserve
        valuable state; destructive suite data removal remains a separate,
        previewed arena-setup purge transaction.
      - DEB and RPM adapters receive the same validated, scope-neutral staging
        tree. Adding or replacing one package adapter does not change Manager
        component production or the other package format.
  artifact_names:
    - UCI-Arena-Setup-<version>-windows-x64-online.exe
    - UCI-Arena-Setup-<version>-windows-x64-offline.exe
    - UCI-Arena-Manager-<version>-windows-x64-user.msi
    - UCI-Arena-Manager-<version>-windows-x64-machine.msi
    - uci-arena-manager_<version>_amd64.deb
    - uci-arena-manager-<version>-1.x86_64.rpm
    - uci-arena-setup-<version>-linux-x86_64-online.run
    - uci-arena-setup-<version>-linux-x86_64-offline.run
  suite_media:
    source: accepted_immutable_candidate_plus_signed_tuf_metadata
    windows_chain: manager_msi_then_arena_setup_complete_with_transactional_rollback
    online_behavior: >
      Carries the accepted core component digest set and permits explicit
      network acquisition of selected external file sets.
    offline_behavior: >
      Carries the same accepted core component digest set and forces
      arena-setup offline mode; credentials and external Syzygy bytes remain
      excluded.
    transport_rule: >
      Offline fixed-scope bundles pass --offline to both apply and repair;
      online bundles omit it. Uninstall never receives a transport flag.
    retained_channel:
      location: manager_data_root/release
      contents: [signed_catalog, signed_tuf_metadata, current_platform_payloads]
      activation: verified_staging_then_atomic_rename
      purpose: >
        Keep repair, upgrade, and the dashboard's explicit download/import
        guidance functional after self-extracting installer media is removed.
      rules:
        - Persist only current-platform or portable catalog artifacts.
        - Verify every retained local artifact by its catalog size and SHA-256.
        - Prefer content-cache hard links and copy only when a hard link is not possible.
        - Never retain credentials or external Syzygy collection bytes.

components:
  required:
    - manager.core
  complete_arena:
    - manager.core
    - uci_arena.engine
    - node_runtime.private
    - stockfish.engine
    - book_forge.service
    - opening_book.standard
    - uci_arena_evidence.runtime
    - uci_arena_evidence.service
    - lichess.adapter
  composition_rules:
    - The Installer-owned product composition declares suite version, exact
      component versions, source repositories, required/default selection,
      and dependency edges independently from platform artifact locks. A
      platform lock realizes that composition with immutable artifact,
      manifest, digest, and provenance identities; it cannot silently replace
      a component version or dependency.
    - Release assembly compares every resolved immutable component manifest
      with the product composition before catalog generation. Every dependency
      declared by arena-component.json must appear in that component's
      composition dependency edges. Composition may add explicit suite wiring,
      but it may never omit or weaken a provider-declared runtime dependency.
    - Release assembly rejects an installer-integration workspace declaration
      that is absent from or differs from the component manifest's top-level
      workspace_name. A clean suite build cannot defer that provider contract
      contradiction to the installed setup transaction.
    - Every platform release lock records the exact product-composition file
      name and SHA-256. Lock validation resolves component identity,
      repository, version, and dependency edges from that composition rather
      than from a hardcoded component table in release tooling.
    - A lock with release_ready false is reviewable planning data only. It may
      be validated and dry-run inspected, but acquisition, mirroring,
      assembly, signing, installation mutation, and publication must reject it.
    - Presets and explicit custom selection are the only authorities that add
      ordinary components to a plan. The planner never injects manager.core,
      a runtime, or any other product identity implicitly.
    - Named optional-component groups translate operator requests such as
      download missing knowledge, books, or tablebases into component ids.
      Group membership is catalog data and never a component-id prefix test.
    - Catalog fields declare default activation, capacity-degraded activation,
      and whether installed bytes are also copied to the knowledge activation
      root. Product identities never select any of those planner behaviors.
    - The validated default model is an immutable runtime asset inside the
      uci_arena.engine provider component and is not selected as a nonexistent
      independent catalog component.
    - The Lichess adapter payload is installed disabled. Credentials are not
      accessed and per-user startup is not registered until explicit bot onboarding.
  optional:
    - lichess.adapter
    - opening_book.standard
    - syzygy.wdl.3-4-5
    - syzygy.dtz.3-4-5
    - syzygy.operator_import
    - external_uci_engine
  detect_only:
    - restaurant.training_system

knowledge_assets:
  download_missing_option: true
  command_options:
    all: --download-missing-knowledge
    opening_books: --download-missing-books
    endgame_tables: --download-missing-tablebases
  opening_book:
    default_component: opening_book.standard
    runtime_dependencies: []
    snapshot_schema: uci_arena_book_snapshot_v2
    manifest: snapshot.manifest.json
    required_files_source: snapshot_manifest_artifact_map
    rules:
      - Inventory validates the bounded, path-safe artifact map and current
        file presence without turning discovery into an unbounded hash pass.
        Reviewed import and staged activation validate every exact declared
        digest before granting managed authority. Installer mechanism code
        contains no opening-book filename list.
      - A provider filename or layout change updates the provider manifest and
        composition data without changing inventory or deployment control flow.
    behavior: >
      Install a mutually validated provider snapshot. If only the Book Forge
      bootstrap snapshot is available, label it integration and do not claim
      strength qualification.
  syzygy:
    default_download_component: syzygy.wdl.3-4-5
    optional_download_component: syzygy.dtz.3-4-5
    import_existing: true
    artifact_size_and_digest_source: signed_catalog_only
    whole_collection_guessing: forbidden
    catalog_transport:
      artifact_type: file_set
      manifest_schema: arena_syzygy_file_set_manifest_v1
      portable_target_triple: any-any
      manifest_payload: exact_relative_path_url_size_and_sha256_per_file
      activation: verified_files_then_atomic_directory_pointer
      offline_media_inclusion: false
      rules:
        - The provider candidate contains only the exact signed manifest and
          validation evidence, never the tablebase collection bytes.
        - Planning uses total_size_bytes and file_count committed by the signed
          suite catalog; apply rejects a manifest whose totals differ.
        - Every file is resumably acquired into the content-addressed cache and
          verified before staging. Partial collections never become active.
        - The manifest and catalog may reference only HTTPS or suite-local
          fixture sources; redirects cannot weaken transport or digest checks.
  rules:
    - The engine remains network-free and consumes local immutable assets only.
    - Missing assets are visible and actionable, never silently substituted.
    - Downloading the signed opening-book snapshot never installs or requires
      the Book Forge producer, its private Node runtime, or its 75 GiB
      operational workspace.
    - A user may select download, import an existing directory, or continue in degraded mode.
    - Inventory reports an activated knowledge asset as installed_managed only
      when an installed-managed receipt declares that resource kind and owns
      activation files that still exist under the configured knowledge root
      with their recorded sizes. Full content integrity remains the verify
      command's responsibility.
    - Inventory projects a validated saved or bounded-discovery opening-book or
      Syzygy locator into the knowledge summary as detected_unmanaged when no
      installed-managed activation is present. Syzygy counts and bytes cover
      only regular .rtbw and .rtbz files directly inside the selected directory;
      the projection never recurses, follows links, copies, or modifies files.
    - Component identity, filename prefixes, and consumption capabilities never
      grant knowledge-file activation authority. An installable component must
      publish a validated activation declaration whose resource kind, source,
      and destination are independent of its component id.
    - When a signed component activates declared knowledge and no explicit saved
      locator exists, arena-setup transactionally saves the verified activation
      directory as the selected locator before generating consumer
      configuration. An explicit imported locator always wins.

knowledge_activation:
  component_manifest_contract:
    field: activation
    maximum_entries: 4
    destination_roots: [knowledge_root]
    kinds: [opening_book, syzygy]
    required_fields: [kind, source_path, destination_root, destination_path]
    rules:
      - Source and destination paths are safe relative paths. Every source
        contains at least one digest-listed payload file, and each destination
        is strictly beneath the Installer-owned knowledge root.
      - Each resource kind and destination is unique within a component. Source
        and destination trees may not overlap another declaration.
      - Each activated resource has a matching read-only discovery declaration
        for the same kind and component-relative source. Discovery remains
        evidence only and does not grant mutation authority.
      - The complete activation plan, including prior-destination evidence and
        rollback locations, is durably journaled before the first destination
        changes. Each applied destination is checkpointed independently.
      - Commit cleanup and rollback traverse every declared activation. Rollback
        removes candidates and new destinations and restores prior destinations
        in reverse activation order.
  receipt_contract:
    field: activated_resources
    fields: [kind, path, activated_files]
    rules:
      - Receipt resource declarations, not component ids, select managed
        inventory state and installed-resource discovery.
      - The legacy flat activated_files projection remains during schema v1 for
        uninstall/purge compatibility and contains the exact union of every
        activated resource file.
      - Normal uninstall removes component authority while preserving activated
        knowledge. Explicit purge remains exact-identity and ownership-aware.

discovery:
  interface: arena_setup_discovery_v1
  locator_interface: arena_saved_locator_v1
  component_manifest_contract:
    field: discovery
    maximum_entries: 16
    locator_sources: [active_root, entrypoint, component_path]
    rules:
      - Each resource kind is unique within one component manifest.
      - Entrypoint locators name a digest-listed component entrypoint.
      - Component-path locators are safe relative paths containing at least one
        digest-listed payload file.
      - Install receipts and bounded provider-root inspection resolve only these
        declarations; component ids, repository names, filename prefixes, and
        historical versions never select a discovery kind.
      - Discovery conveys read-only location evidence and grants no activation,
        registration, startup, or deletion authority.
  kinds:
    - opening_book
    - syzygy
    - uci_engine
    - book_forge
    - evidence_service
    - timing_profile
    - lichess_single_game_profile
    - lichess_capacity_profile
    - lichess_transport_profile
    - lichess_token_path
    - restaurant
  precedence:
    - saved_locator
    - install_receipt
    - provider_manifest
    - indexed
    - discovered
    - unresolved
  bounded_sources:
    - install_receipts
    - saved_locators
    - package_databases
    - windows_registry
    - windows_services
    - windows_task_scheduler
    - systemd
    - path_environment
    - standard_install_roots
    - provider_manifests
    - user_selected_roots
    - operating_system_file_index
  indexed_asset_search:
    owner: replaceable_platform_search_adapter
    kinds:
      - opening_book
      - syzygy
      - timing_profile
      - lichess_single_game_profile
      - lichess_capacity_profile
      - lichess_transport_profile
    windows_adapter: Windows_Search_SystemIndex
    linux_adapter: plocate_or_locate_database
    maximum_results: 256
    command_timeout_milliseconds: 2000
    candidate_ownership: external_dependency
    rules:
      - Indexed search queries only immutable extension or bounded filename patterns;
        it never walks the filesystem recursively.
      - Product-owned query rules cross the platform port as typed extension
        and filename-glob data. Windows Search and locate adapters translate
        those rules without owning UCI Arena filenames or resource semantics.
      - The platform adapter returns candidate paths and bounded status only.
        Kind inspectors classify content, directory shape, identity, legacy
        status, and symbolic-link safety without turning ordinary discovery
        into a compatibility gate.
      - An unavailable, stale, denied, timed-out, or truncated index is visible
        in arena_setup_discovery_v1 and falls back to bounded standard roots and
        explicit browse without failing inventory.
      - Duplicate candidates are normalized and deterministic. A search result
        is never installation authority and requires explicit import before use.
      - Within one discovery source class, deterministic content evidence ranks
        the stronger reusable candidate before path ordering. Book payload bytes,
        Syzygy coverage bytes, and evidence qualification/sample counts are
        advisory discovery quality only and never substitute for activation gates.
      - Syzygy candidates are reduced to their containing flat collection and
        referenced in place. Opening books and timing-evidence candidates are
        never copied merely because the index found them.
      - Parseable timing evidence remains discoverable and cataloged even when
        legacy, incomplete, or incompatible with the currently selected
        runtime. Exact identity and qualification are enforced only when a
        consumer claims the profile is applied or protected-live-safe.
      - Parseable single-game, capacity, and transport evidence remains
        discoverable when unqualified, legacy, incomplete, or runtime-mismatched.
        Discovery reports the evidence classification; import and consumer
        activation retain their exact schema, closure, qualification, and
        identity gates.
      - Discovery and preservation never compare a book, Syzygy collection, or
        timing-evidence file to the suite product version. Compatibility is
        capability- and content-based. Unknown optional metadata, newer minor
        fields, absent sidecars, partial table coverage, or a different runtime
        identity are reported without hiding, deleting, or blocking the asset.
        A consumer that cannot activate evidence keeps it cataloged and explains
        the missing capability, migration, or requalification needed.
      - A usable Polyglot book does not require optional statistics or policy
        sidecars. Missing sidecars reduce projected capabilities rather than
        blocking discovery or import.
      - Indexed .bin candidates must satisfy bounded Polyglot record framing
        and sampled ordering semantics so unrelated binary files do not crowd
        out real books. This content check does not require a release version,
        sidecars, or a Book Forge publication manifest.
      - Any nonempty flat Syzygy WDL or DTZ subset is discoverable and usable
        for the positions it covers. WDL does not require DTZ, and incomplete
        cardinality coverage is reported rather than rejected.
      - A validated saved locator is the operator's selected asset and outranks
        an installed bootstrap candidate in the read-only discovery projection.
        Installed authority remains visible on its receipt candidate and is
        never inferred from selection precedence.
      - Inventory re-inspects the current content behind a saved knowledge or
        evidence locator. Cached locator validation is not current authority;
        unreadable or invalid retained content remains visible as broken and
        requires explicit reselection.
      - When a saved locator names the exact same normalized resource as a valid
        managed receipt, the receipt is selected so the projection does not
        demote known installation authority to unmanaged retained state.
  user_selected_root_behavior:
    maximum_directory_depth: 1
    multiple_explicit_roots: supported
    detected_at_root_or_direct_child:
      - opening_book_file_or_flat_directory
      - syzygy_directory
      - timing_profile_file
      - lichess_single_game_profile_file
      - lichess_capacity_profile_file
      - lichess_transport_profile_file
      - known_uci_engine_filename
      - provider_component_manifest
    ordering: source_precedence_then_advisory_quality_then_normalized_path
    rule: >
      A user-selected or explicitly mounted root is inspected only at the root
      and its direct non-symbolic-link children. It is never treated as
      permission to recurse through the containing volume.
    explicit_mount_rule: >
      Opening-book, Syzygy, engine, and provider paths mounted at different VM
      locations are each supplied as an independent bounded scan root. The
      acceptance harness never requires a synthetic combined directory,
      symbolic link, junction, or copy of provider-owned assets.
  whole_disk_recursive_scan: forbidden
  symbolic_link_traversal: forbidden
  registration_after_detection: explicit_only
  engine_probe: [process_launch, uciok, readyok, typed_options, legal_startpos_bestmove]
  engine_naming:
    uci_arena_executable_names: [uci_arena_engine.exe, uci_arena_engine]
    model_branded_executable_aliases: forbidden
    rule: >
      Model package labels are not product identities and never participate in
      installer discovery. Other UCI engines require their own recognized
      product executable or an explicit operator-selected path.
  browse_contract:
    returned_per_kind: [selection, filters, hints, managed_copy_allowed]
    paths_are_non_secret: true

local_import:
  interface: arena_setup_import_result_v1
  command: arena-setup --json import --kind KIND --path PATH
  default_mode: in_place_reference
  saved_location: manager_data_root/locators
  managed_copy:
    allowed_kinds: [opening_book, lichess_single_game_profile]
    opening_book_maximum_bytes: 268435456
    opening_book_maximum_files: 64
    lichess_profile_closure_maximum_bytes: 67108864
    lichess_profile_closure_maximum_files: 16
    staging: immutable_then_atomic_activation
    receipt: arena_install_receipt_v1
  validation:
    opening_book: regular_file_or_flat_directory
    syzygy: directory_with_rtbw_or_rtbz
    uci_engine: full_uci_startup_interrogation
    book_forge: provider_root_or_regular_cli_entrypoint
    evidence_service: provider_root_or_regular_cli_entrypoint
    timing_profile: qualified_uci_time_profile_v3_regular_file
    lichess_single_game_profile: >
      qualified_uci_arena_single_game_profile_v1_with_complete_hash_verified_evidence_closure
    lichess_capacity_profile: qualified_uci_arena_lichess_capacity_profile_v2_regular_file
    lichess_transport_profile: qualified_uci_arena_lichess_transport_profile_v2_regular_file
    lichess_token_path: path_reference_only_never_read
    restaurant: detect_only_import_forbidden
  rules:
    - Import never scans outside the supplied path and its explicitly allowed flat entries.
    - In-place imports save only normalized locators and never copy provider-owned data.
    - Syzygy tablebases are always referenced in place.
    - Timing profiles remain identity-bound in-place references and are never copied or rewritten.
    - A Lichess single-game profile is copied without rewriting into immutable
      Manager-owned storage together with its bounded, hash-verified evidence
      closure. Relative evidence paths are resolved only against the profile
      directory and bounded ancestors of the explicitly selected profile; an
      unsafe, ambiguous, missing, oversized, or hash-mismatched closure is
      rejected before activation.
    - Managed Lichess profile staging and active roots use bounded internal
      directory identifiers rather than embedding complete digests in path
      names. Full content identity remains in the manifest and receipt, and an
      existing shortened root is reused only after its complete manifest and
      payload identity validate. Valid content-addressed evidence filenames
      must not fail merely because the Manager data root is a normal Windows
      path.
    - Lichess capacity and transport profiles remain qualified in-place
      references and are never copied or rewritten. The capacity profile must
      bind the exact selected single-game profile digest.
    - Consumer activation verifies a timing profile's Engine-owned semantic
      timing authority against the installed timing/search contract, model
      semantics, provider/runtime and hardware identity, and effective search
      topology. Its qualified executable digest remains provenance and may
      differ after a timing-compatible rebuild. Single-game and capacity
      evidence remain bound to the exact installed executable. An incompatible
      profile remains discoverable evidence but is never presented as applied.
    - A successful import transaction regenerates and verifies every installed
      consumer configuration and active-model pointer affected by that locator
      before committing the locator. Failure restores the previous locator,
      configurations, and pointers.
    - Managed-copy opening books publish the activated immutable directory as
      the saved opening-book locator in the same transaction.
    - Installing Evidence Service projects explicit timing-profile locators through its public profile-list command.
    - Managed-copy opening books reject symbolic links, nested directories, and payloads larger than the declared maximum.
    - Lichess token contents are never opened, hashed, copied, logged, returned, or placed in argv.
    - A Lichess token locator must reference an operator-owned file outside
      Manager-owned data and immutable installed component roots. Saving a
      token file under Manager data is rejected before locator persistence.
    - Book Forge receives an imported Lichess credential only as the saved
      token-file path in its generated provider configuration. The installer
      never opens the referenced file, and a later token-path import
      transaction regenerates the installed Book Forge configuration and
      invokes Book Forge's bounded public acquisition retry-auth operation.
      Apply, repair, and upgrade may make at most three ten-second invocations,
      with a 250-millisecond bounded retry delay when a well-formed response
      reports that authentication is still blocked. A malformed response,
      missing credential configuration, or provider command failure stops
      immediately. The provider response must confirm a ready credential
      configuration; exhaustion rolls back the locator, generated
      configuration, payload, receipt, and prior startup state. Failure detail
      identifies only the rejected public response field and never includes a
      credential value or token-file path.
    - Restaurant remains visible as detect-only and is never registered, copied, installed, started, or controlled.

vm_mounts:
  local_ephemeral_component_runner:
    implementation: tools/release/invoke-local-ephemeral-release.ps1
    scope: manually_dispatched_private_component_candidate_only
    official_suite_release_authority: false
    rules:
      - One command performs clean-tree, exact-head, component-version,
        workflow trigger, runner-label, Visual Studio environment, CMake, Git,
        Git Bash, PowerShell module-path, GitHub authentication, and signing-
        workflow prerequisite checks before obtaining a registration token or
        dispatching work.
      - Normal component releases require Ref main and the local source commit
        to equal the exact remote main head. An unmerged ref is rejected before
        runner registration unless the operator explicitly selects the
        diagnostic-only override; diagnostic output has no publication,
        composition-lock, or stable-suite authority.
      - A component workflow that uploads to a pre-provisioned candidate passes
        one explicit version-bound release tag. Before obtaining a runner token,
        the operator-authenticated coordinator creates the missing prerelease at
        the exact source head or verifies the existing release is non-draft,
        prerelease, exact-head, and empty. Existing assets fail closed before
        dispatch; an empty candidate left by an earlier pre-upload failure is
        safely reusable. Preflight-only reports intent and never creates it.
      - A component may declare its immutable version statically or bind the
        workflow_dispatch version through the release build, component-artifact
        construction, and immutable release tag. Dynamic-version preflight
        requires that complete chain plus a checked-in component definition;
        an unconstrained workflow input is not version authority.
      - The runner is repository-scoped, ephemeral, update-disabled, and
        removed after exactly one bounded workflow attempt. Registration tokens
        are obtained just in time, suppressed from output, and never written to
        tracked files or retained logs.
      - Read-only GitHub run discovery and monitoring retry transient CLI/API
        failures three times without ending the runner job. On a terminal local
        wrapper failure, cancellation is requested and both workflow and runner
        process must drain before the work root is removed. If drain cannot be
        proved within five minutes, the root is preserved and reported rather
        than deleted beneath an active action.
      - Before dispatch, the wrapper snapshots recent workflow run ids. It binds
        monitoring only to the one exact new id for the requested source head;
        timestamps are not identity. If more than one new matching run appears,
        the wrapper refuses ambiguity and preserves the runner rather than
        deleting files that an unowned active job may be using.
      - After exact run-id discovery, the local ephemeral runner process and
        bounded log sizes are the active-job lifecycle signals. GitHub is not
        polled while that process is running. After it exits, transient final-
        status read failures remain non-terminal until the overall deadline;
        they never trigger cleanup beneath a running action.
      - Runner and workflow output is redirected to an ignored bounded local
        log directory; conversational or pull-request evidence contains only
        status, paths, sizes, counts, and digests.
      - Preflight projects both native CMake scratch and deep Manager vcpkg/MSVC
        file-tracker paths under the configured runner work root and rejects
        more than 240 characters before registration. The default uses C:\ar, a
        sixteen-character ephemeral directory id, and work directory `w`; the
        runner remains ephemeral and is removed after the attempt.
      - A physical developer host may produce a private attested component
        candidate through this explicit diagnostic transport. It is never a
        protected suite acceptance runner, stable promotion authority, or
        substitute for the official Installer release workflow.
  protected_runner_provisioning:
    implementation: tools/release/provision-hyperv-runner.ps1
    physical_host_registration: forbidden
    runner_registration: repository_scoped_ephemeral
    runner_update: disabled_and_version_pinned
    host_access:
      account: generated_least_privilege_matching_local_identity
      opening_books: read_only_smb
      syzygy: read_only_smb
      workspace: change_smb
      firewall_scope: hyper_v_default_switch_subnet_only
    secret_lifecycle:
      - Registration tokens are obtained just in time and embedded only in the
        disposable guest bootstrap.
      - The guest bootstrap deletes itself after runner registration.
      - Lichess shares are omitted unless the explicit Lichess runner mode is
        selected.
  immutable_asset_root:
    runner_environment: ARENA_VM_ASSET_ROOT
    contents:
      - opening_books
      - syzygy
      - optional_external_uci_engines
      - optional_provider_component_roots
    installation_mode: in_place_reference
    copy_into_manager_storage: forbidden
    acceptance_evidence:
      - bounded_scan_discovers_books_and_syzygy
      - separate_explicit_mount_roots_are_supported
      - explicit_import_saves_normalized_locator
      - no_managed_receipt_claims_asset_ownership
      - file_name_size_and_timestamp_metadata_unchanged
  writable_workspace_root:
    runner_environment: ARENA_VM_WRITABLE_ROOT
    contents:
      - manager_state
      - book_forge_workspace
      - evidence_workspace
    minimum_residual_gib: 75
  lichess_secret_mount:
    runner_environment: ARENA_LICHESS_TOKEN_FILE
    mode: path_reference_only
    account: existing_operator_bot_account
    rules:
      - The acceptance system does not require or create a second BOT account.
      - The mounted token path is imported through Manager before it is passed
        blindly to the installed adapter process that requires it.
      - Manager and release automation never open, copy, hash, print, or embed
        token contents.

capacity:
  per_volume:
    - download_cache_bytes
    - staging_bytes
    - installed_bytes
    - backup_bytes
    - operational_reserve_bytes
    - peak_required_bytes
  shared_dependency_count: once
  staging_headroom: max_1_gib_or_10_percent
  book_forge_residual_workspace_gib: 75
  evidence_residual_workspace_gib: 75
  same_volume_residual_threshold: maximum_not_sum
  complete_preset_insufficient_workspace: block
  custom_preset_insufficient_workspace: install_disabled_only

transaction:
  staging: immutable
  verification: before_activation
  release_media_preflight: >
    Before any component, receipt, workspace, service, or existing release-media
    mutation, validate that the catalog and every retained local payload use
    safe relative paths and match their declared size and digest. A retention
    policy failure is a preflight failure and must leave the installed state
    unchanged; the CLI must never report an installation failure after silently
    committing components for a catalog it already knows cannot be retained.
  activation: atomic_version_pointer
  journal: durable_before_each_side_effect
  backup: before_replacement_or_migration
  failure: restore_previous_activation_and_service_state
  normal_uninstall: preserve_user_data
  uninstall_and_purge_lifecycle:
    uninstall_plan: arena_install_uninstall_plan_v1
    preservation_record: arena_install_uninstall_preservation_v1
    purge_plan: arena_install_purge_plan_v1
    rules:
      - Uninstall and purge are distinct modes and commands. Uninstall never
        accepts a purge flag or performs a destructive user-data operation.
      - Uninstall builds and validates its complete plan before mutation. The
        plan removes receipt-owned immutable roots, provider startup authority,
        installer-owned registrations and integrations, and component receipts.
      - Before receipt removal, uninstall durably records non-authoritative
        preservation evidence derived from that exact receipt. Preserved
        evidence supports a later purge preview but is never installation proof.
      - Purge requires a separately emitted plan, an exact current preservation
        evidence identity, and explicit confirmation. A direct purge without a
        reviewed plan is invalid.
      - Purge paths are normalized, path-bounded, ownership-classified, and
        declared by receipt or preservation evidence. Configured root equality,
        symbolic-link traversal, external ownership, and unknown ownership are
        never deletion authority.
      - Platform filesystem adapters apply the same supported path semantics to
        staging, validation, identity checks, uninstall, and purge. Stored plans,
        receipts, preservation evidence, and logs retain normalized operator paths;
        platform API prefixes are syscall-only and never become ownership evidence.
        A path accepted during managed activation must remain inspectable and
        removable by a later ownership-authorized purge.
      - Digest-owned managed files are removed only when their current size and
        SHA-256 still match ownership evidence. Modified files are preserved and
        reported as modified_managed_file; absence is an idempotent skip.
      - Purge cannot promise rollback after destructive data removal. Every
        operation and partial failure remains visible in transaction evidence.
  manager_data_root_retention:
    windows_defaults:
      per_user: "%LOCALAPPDATA%\\UCI Arena Manager"
      per_machine: "C:\\ProgramData\\UCI Arena Manager"
    purpose: >
      Normal uninstall removes executable authority and managed component
      receipts while preserving operator state required for reinstall,
      recovery, audit, and large-asset reuse. Retention is deliberate and must
      not be inferred from an implementation-wide decision to leave a
      directory behind.
    preserved_on_normal_uninstall:
      - path: arena.db
        reason: canonical Manager resources, operations, audit records, and history
      - path: client.key
        reason: local CLI and browser-pairing continuity after reinstall
        security: preserve file ACLs and never print or export the key
      - path: knowledge/
        reason: downloaded, imported, managed-copy, and Book Forge-generated books, sidecars, manifests, and Syzygy assets may be large or user-owned
      - path: locators/
        reason: validated path-only references plus timing, single-game, capacity, and transport profile selections
      - path: release/
        reason: verified current-platform catalog, TUF metadata, and payloads used by repair
      - path: trust/
        reason: highest verified TUF versions required for rollback protection
      - path: cache/
        reason: content-addressed verified downloads that avoid unnecessary reacquisition
        authority: non_authoritative_until_digest_reverified
      - path: transactions/
        reason: recovery and audit evidence for completed or interrupted installer operations
      - path: logs/
        reason: redacted installer and component lifecycle accountability
      - path: workspaces_outside_data_root
        reason: Book Forge observations, qualification evidence, snapshots, and Evidence raw evidence, datasets, exports, timing profiles, and other provider state are not installer payload
      - path: provider-data/
        reason: manifest-declared product-data provider workspaces remain provider-owned mutable state even when placed beneath the suite data root
    removed_on_normal_uninstall:
      - every receipt-selected immutable component root
      - every provider startup registration owned by an installed receipt
      - every installer-owned service, scheduled task, startup registration, and integration
      - every component receipt JSON document
      - the Manager Windows service and MSI-owned program files
    rules:
      - The receipts directory may remain empty; no installed component
        authority survives merely because the directory exists.
      - Interrupted staging or rollback paths remain recovery evidence until a
        later verified operation resolves them; they are never silently
        activated.
      - Normal uninstall does not promise secure erasure. Purge is a separate,
        explicit, previewed operation and may remove only declared paths.
      - Externally owned token files, in-place books, tablebases, engines, and
        profiles are preserved by both uninstall and purge.
      - A retained path, cache entry, locator, workspace, or transaction record
        is never proof that its former component remains installed. Only a
        validated active root, registration, and component receipt confer
        installation authority.
      - Reinstall revalidates retained locators, release media, cache entries,
        trust state, provider workspaces, and qualified profiles before consuming them.
  suite_uninstall:
    command: arena-setup uninstall --all --yes
    preview_command: arena-setup uninstall-plan --all
    ordering: reverse_dependency_order_derived_from_receipts
    rules:
      - Provider-owned startup adapters are invoked through their verified
        installed startup, CLI, or adapter entrypoint and private Node runtime
        before payload removal, using the provider's component-specific managed
        workspace argument.
      - Uninstall fails closed if a provider startup registration cannot be
        stopped and removed.
      - Payload removal uses a bounded retry after provider shutdown so Windows
        process teardown cannot strand a partially removed immutable root.
      - Removing a shared runtime by itself is rejected while an installed
        startup-capable provider still depends on it.
      - Normal suite uninstall removes every managed receipt and immutable
        component root, including an empty per-component parent directory,
        while preserving workspaces, locators, imported in-place assets, and
        retained release media.
      - A Windows bundle stamps its immutable Burn provider key as bundle_owner
        on every selected component receipt before related-bundle removal.
      - Bundle-driven uninstall removes only receipts whose bundle_owner exactly
        matches the calling bundle. A related older bundle treats an empty
        owner-scoped selection as a successful no-op and cannot remove receipts
        adopted by the newly installed bundle.
  purge: separate_preview_plan_then_confirmed_apply_with_optional_export
  generated_service_configuration:
    owner: arena_setup
    location: selected_service_workspace
    inputs: exact_receipt_verified_dependency_entrypoints
    managed_workspace_access:
      purpose: >
        Let the least-privilege Manager service invoke each provider's public
        CLI against its exact managed workspace without changing provider
        ownership or granting access outside that workspace.
      windows:
        principal: NT AUTHORITY\LOCAL SERVICE
        permission: modify
        inheritance: selected_workspace_children_only
        implementation: native_dacl_adapter
      linux:
        principal: uci-arena
        permission: read_write_traverse
        inheritance: selected_workspace_default_acl
        implementation: fixed_setfacl_adapter
        package_dependency: acl
      scope:
        - book_forge_workspace
        - evidence_service_workspace
        - lichess_adapter_workspace
      rules:
        - Access is granted only after the normalized workspace is selected
          beneath workspace_root and before Manager-owned configuration is
          written.
        - No permission is granted to an external Lichess token file, imported
          asset, provider source tree, or the operator profile as a whole.
        - Permission setup is fail-closed; an installed service may not be
          reported as integrated when Manager cannot access its public CLI
          workspace.
    managed_dependency_entrypoints:
      canonical:
        node_runtime.private: node
        stockfish.engine: stockfish
      legacy_managed_candidate_compatibility:
        accepted_key: executable
        scope:
          - node_runtime.private:node
          - stockfish.engine:stockfish
        rules:
          - The alias is accepted only when the requested canonical entrypoint
            is absent from the exact verified managed-component manifest.
          - The aliased path must still be a safe relative path listed with an
            exact size and SHA-256 in that same manifest.
          - New managed-component candidates emit the canonical key; the alias
            exists only so already locked and attested candidates remain
            installable without weakening their content verification.
    book_forge:
      - stockfish
      - saved_lichess_token_path_reference_when_available
    evidence_service:
      - exact_installed_evidence_runtime_root
      - uci_arena_engine
      - installed_model_root
      - stockfish
      - evidence_runtime_complete_game_referee
      - manager_owned_runtime_models_root
      - manager_owned_active_model_pointer
      - explicit_timing_profile_imports
      - exact_installed_engine_digest
    lichess_adapter:
      - uci_arena_engine
      - installed_model_root
      - selected_qualified_timing_profile
      - selected_qualified_single_game_profile
      - selected_qualified_capacity_profile
      - selected_qualified_transport_profile
      - selected_opening_book_and_sidecars
      - selected_syzygy_directory
      - token_path_excluded
    rollback: restore_previous_configuration
  provider_startup:
    owner: provider_public_adapter_invoked_by_arena_setup
    install_trigger: enabled_non_credential_gated_component_apply_repair_or_upgrade
    receipt_field: startup
    rules:
      - An enabled component declaring startup_install is not committed until
        its verified installed entrypoint reports installed true.
      - Credential-gated Lichess startup is never installed merely because its
        component and token-file locator exist. Its verified adapter entrypoint
        remains available for explicit startup, status, and uninstall, and
        suite uninstall removes any provider-owned startup registration before
        payload removal.
      - When a provider reports matchesCurrentConfiguration, it must be true.
        Manager never reinterprets or substitutes a provider health contract.
      - Evidence Service startup install must report active true in addition
        to installed true and matchesCurrentConfiguration true. The suite
        transaction fails before commit when the replacement daemon is not
        live; a retained status file or successful task creation is not a
        substitute.
      - Verify uses the provider's public service-health contract, not an
        undeclared startup-control action. A malformed, identity-mismatched,
        schema-mismatched, unhealthy, or unavailable live status fails
        verification without mutation.
      - Transaction rollback invokes startup_uninstall before restoring or
        removing the provider payload.
      - Disabled component binaries are installed without startup registration.
  service_transition_scripts:
    owner: arena_setup_and_native_package_lifecycle
    windows:
      before_change: stop_affected_provider_startup_then_manager
      after_change: restart_manager_then_verify_selected_provider_startup
    linux:
      before_change: prerm_or_arena_setup_stop_affected_services
      after_change: postinst_or_arena_setup_daemon_reload_enable_start_verify
    rules:
      - Scripts use typed service identities and provider public lifecycle
        entrypoints; arbitrary executable, argv, and shell input are forbidden.
      - Before repair or upgrade renames an existing startup-capable component
        root, arena-setup durably records the prior receipt and invokes that
        exact verified provider's startup_uninstall entrypoint. Payload rename
        waits for bounded operating-system process teardown and fails closed
        if the version root remains locked.
      - When the validated replacement publishes startup-control v2,
        arena-setup instead invokes its staged pre_replace action against the
        exact prior receipt-owned workspace. Success must prove startup is no
        longer installed before the old component root can be renamed.
      - If a later transaction step fails, rollback restores the prior payload,
        receipt, generated configuration, and active-model pointer before
        invoking the prior receipt's startup_install entrypoint. Failure to
        restore that startup is recorded as rollback_failed and is never
        reported as an exact rollback.
      - Component startup outcomes are recorded in the install transaction.
        The installer wrapper preserves the Manager service's prior
        running/stopped state across its bounded multi-operation feature
        reconciliation.
      - A component is never reported installed, removed, repaired, or upgraded
        until its required service transition has completed successfully.
      - If the operating system refuses the final Manager service restoration,
        setup returns an error and leaves verified receipts as the authoritative
        recovery state; it never claims an exact rollback that did not occur.
      - Windows Manager stop/start transitions wait for the requested SCM state
        within a bounded deadline. A service stop that arrives while the HTTP
        event loop is starting is latched and completed rather than leaving an
        unchanging STOP_PENDING service for MSI or arena-setup to force-kill.
  installed_engine_handoff:
    owner: arena_setup
    rules:
      - Saved opening-book and Syzygy locators are revalidated immediately
        before a generated consumer configuration is activated.
      - A flat opening-book directory selects strong_rare_v1.bin when present;
        otherwise it must contain exactly one supported book file. Ambiguous
        directories require the user to import the intended file explicitly.
      - BookFile, BookStatsFile, BookPolicyFile, and SyzygyPath retain their
        normalized in-place paths; large assets are never copied.
      - Lichess adapter receipts expose the Manager-generated configuration
        path used to hand the selected assets to the installed UCI engine.
      - Verify regenerates the expected configuration from receipt-verified
        component roots and currently valid saved locators, and fails on
        missing, stale, or altered generated configuration.
      - When a qualified timing profile is selected, arena-setup writes
        and transactionally verifies an Evidence-compatible active-model
        pointer bound to the installed engine, model root, provider, options,
        and the executable digest computed from the verified installed
        entrypoint. The timing profile's historical executable digest is
        retained as qualified-build provenance and is never substituted for
        the installed executable digest or used as timing authority. It never
        points the service at its own configuration file.
      - Timing-profile locator admission follows the Engine-owned v3 timing
        contract. For an otherwise valid older v3 profile that lacks only the
        additive permissions projection, provider-safety and forecast-shadow
        qualification are derived only when every required base and
        search-core-specific timing gate passes. An explicit false remains
        false, malformed permissions fail closed, and adaptive-play authority
        is never inferred.
      - Lichess configuration activation follows the provider-declared required
        and optional locator bindings, including each binding's accepted
        locator-authority sources. Missing optional timing evidence retains
        conservative foreground search and disables opponent-turn work;
        missing, invalid, incompatible, or unqualified transport evidence
        selects the provider-owned 650 millisecond bootstrap reserve. Provided
        evidence is never weakened or rewritten, and the provider remains
        authoritative for the exact qualification required by a selected
        live-play mode before it accesses credentials.
      - Runtime verification requires opening_book_active and syzygy_active,
        not merely the presence of saved locators.
      - Protected live acceptance requires the selected timing profile to be
        accepted, applied, exact-semantic-timing-authority-bound, and
        provider-safety-qualified with a positive reserve after installer-owned
        knowledge locators are applied. Provenance-only engine-build drift is
        reported and does not invalidate that timing authority.
  repair:
    rules:
      - Repair restages every selected component from verified release media
        even when the installed version is already current.
      - Repair adopts recoverable partial installation state only by replacing
        the unreceipted immutable root with the verified selected artifact and
        committing a new receipt; the stale root never grants authority.
      - Repair regenerates and verifies installer-owned consumer
        configurations and active-model pointers from current saved locators.
  upgrade:
    rules:
      - Upgrade restages every selected component so the new bundle atomically
        adopts all selected receipts before Burn removes a related older bundle.
      - A prior immutable component root remains available until the replacement
        receipt, generated configuration, startup state, and Manager restart
        have committed. Post-commit maintenance then considers only sibling
        roots beneath the same currently receipted component directory.
      - Superseded roots are removed only after their manifest identity, complete
        file inventory, sizes, and SHA-256 values still match Installer ownership
        evidence. Modified, invalid, linked, or unrecognized roots are preserved
        and reported; they are never treated as installed authority.
      - Superseded-root cleanup is idempotent and non-authoritative. A cleanup
        warning cannot roll back a newly committed working installation, and a
        later repair or upgrade retries the same bounded cleanup safely.

trust:
  metadata: tuf
  roles: [root, targets, snapshot, timestamp, candidate, stable, offline]
  root_keys: offline
  root_bootstrap: exact_root_metadata_sha256_compiled_into_official_arena_setup
  rollback_protection: required
  rollback_state: highest_verified_root_targets_snapshot_and_timestamp_versions_under_manager_data
  artifact_digest: sha256
  windows_defense_in_depth: authenticode
  linux_defense_in_depth: signed_apt_and_rpm_metadata
  secrets_in_argv_logs_catalogs: forbidden

acceptance:
  - Manager-only install works without Node.js.
  - Windows bootstrap and Manager binaries launch on a clean supported Windows
    image without a preinstalled Visual C++ redistributable.
  - Windows GUI acceptance installs from the visible bootstrapper, proves the
    packaged Manager service starts with its native DLLs and dashboard assets,
    verifies the complete receipt-selected suite, and uninstalls through the
    same bundle with no Manager service, provider startup registration,
    immutable component root, or receipt left behind.
  - Complete Arena installs Manager, UCI Arena, Book Forge, and Evidence Service without a source checkout.
  - The Windows Complete acceptance launches installed entrypoints from their
    receipts, loads the bundled model, builds and validates a Book Forge
    integration snapshot, completes a minimal Evidence dataset job, and
    requires Manager to project both outputs through the public CLI contracts.
    It leaves installer-generated provider configuration unchanged. Because a
    developer workstation may legitimately fail Evidence background-idle
    admission, the bounded Evidence workload uses a separate acceptance-only
    configuration copy that changes resource thresholds but retains the exact
    installer-generated dependency and workspace paths.
  - Complete and protected live acceptance register installed optional-service
    startup adapters, uninstall the complete receipt-selected suite, prove all
    startup registrations, immutable version roots, and receipts were removed
    without removing workspaces, imported assets, saved locators, or retained
    media, reinstall from the candidate catalog, verify every new receipt, and
    only then run end-to-end product and service checks.
  - Missing opening books and tablebases can be downloaded from exact signed catalog entries or imported explicitly.
  - Protected VM acceptance mounts existing opening books and Syzygy files,
    discovers them through a bounded selected-root scan, and imports them in
    place without copying or modifying the mounted collection.
  - Protected VM acceptance places Book Forge and Evidence state on a separate
    writable workspace volume with the required residual capacity.
  - Manager validates and projects Book Forge snapshot identities and Evidence Service dataset identities through their public CLIs.
  - Exact packaged-service acceptance invokes output inspection with the
    documented named `--id` argument from an unrelated working directory for
    both Book Forge and Evidence Service. It rejects a missing output through
    the exact `outputs_inspect` error operation rather than misparsing an
    unrelated option or positional value as provider-owned output identity.
  - Offline installation uses the same verified component bytes as stable online installation.
  - Interrupted apply, repair, upgrade, and uninstall preserve a recoverable transaction state.
  - A startup-control-v2 replacement quiesces and retargets an installed v1
    provider through the staged replacement payload, replaces a same-version
    root, resumes the live startup registration, and requires no manual Task
    Scheduler intervention or credential re-entry.
  - A transaction ordered with a shared dependency before its startup consumer
    stages both payloads, quiesces the consumer before the dependency rename,
    defers restart until all roots commit, and restores the prior live startup
    registration after any rollback.
  - A routine component update test emits and applies a verified package while
    proving that no CMake configure, native compilation, MSI build, Burn build,
    or installer-envelope composition entrypoint was invoked.
  - Local component-release preflight rejects version drift, a missing runner
    label, Git Bash or PowerShell module-path breakage, and an unclean or stale
    source head before runner registration or workflow dispatch.
  - Local component-release preflight rejects an unmerged release ref by
    default, rejects a stale local main, and labels the explicit unmerged
    override diagnostic-only.
  - Local component-release preflight accepts a dynamic Manager version only
    when one workflow input is bound through ARENA_VERSION, artifact generation,
    and the immutable release tag, and its component definition identifies
    manager.core.

release_gate_order:
  - provider_attestations
  - reviewed_release_lock
  - immutable_suite_candidate
  - manager_component_candidates_windows_and_linux
  - complete_clean_windows_and_linux
  - external_discovery_and_in_place_import
  - bounded_syzygy_manifest_range_and_real_fixture
  - protected_lichess_live_acceptance
  - release_steward_approval
  - remote_signing
  - exact_digest_publication
release_gate_rules:
  - Provider attestations and Manager release provenance are independently
    verifiable Sigstore bundles; passing the reviewed lock or ordinary GitHub
    artifact transport does not substitute for cryptographic verification.
  - Complete Arena acceptance excludes Lichess credentials and Syzygy bytes;
    those are separate opt-in gates over the same immutable candidate.
  - Production signing jobs require every preceding applicable gate and cannot
    turn an inconclusive optional-service result into a pass.
  - Clean-VM coverage includes Windows 11, Windows Server, Ubuntu, Debian,
    Fedora, and a RHEL-family image on protected ephemeral runners.
  - The Lichess gate uses the existing operator BOT identity, a BOT-titled
    public online opponent, casual standard chess, no more than three
    challenges in twenty minutes, and exactly one required completed game. It
    never requires or provisions a second BOT account.
  - The Lichess gate resolves the installed UCI executable and immutable
    working root plus the installed Lichess configuration template from
    receipts and passes them with the installed model root and configured
    shared knowledge root to the installed adapter. It never relies on
    provider-checkout-relative template paths.
  - The bounded protected Lichess gate requires the installed,
    exact-semantic-timing-authority calibrated time profile to be accepted and
    applied with provider safety qualification and a positive service reserve.
    Provenance-only engine-build drift is retained and reported. Exact
    single-game and one-child capacity qualification remain mandatory.
  - The Syzygy gate verifies signed full manifests without downloading the full
    collection, exercises range downloads against tiny local fixtures, and
    probes either a pinned real three-man test fixture or an explicitly supplied
    SYZYGY_TEST_ROOT in place without copying it.
  - Every accepted Syzygy provider result records a successful one-byte range
    probe for every exact manifest member; the Manager rejects missing,
    incomplete, or larger-transfer range evidence.
  - The signed one-byte probe is represented as status
    availability_verified with content_verified false, exact manifest file
    count, and exactly one transferred byte per file. Full content integrity
    is enforced later against each signed per-file SHA-256 during acquisition;
    the availability probe must never claim that it verified full content.
