validation:
  acquisition_common:
    - source grammar, max source count/strings, expected size/digest, policy bounds
    - offline source filtering and deterministic ordered fallback
    - one overall deadline across multiple sources
    - cancellation before/during transfer
    - HTTPS callback hard byte cap, digest, connect/overall/low-speed/redirect/TLS policy via fake libcurl seam or local test server without external network dependency
    - local source exact capability copy and mutation/path-rebinding failure
    - candidate independent exact reread/hash before activation
    - valid cache hit uses exact target without source work
    - exact corrupt target disposal and valid target never deleted
    - source failure candidate cleanup and zero shared `.partial` files
    - target_occupied exact valid winner acceptance; invalid/foreign collision failure
    - durability-unproven/indeterminate truth
  acquisition_native:
    - per-digest cross-process serialization and release after crash/handle close
    - private cache directory/lock/candidate/quarantine hostile link/reparse/special substitution
    - same-directory no-replace activation and post-classification
    - cleanup only exact acquisition-created cache objects
    - Windows/Linux native evidence
  archive_common:
    - tar+gzip valid archive and explicit rejection of other filters/formats
    - custom capability read callback; source pathname never opened by libarchive
    - exact ARCHIVE_EOF required; WARN/FAILED/FATAL/truncated parser errors fail
    - symlink/hardlink/device/FIFO/socket/sparse/encrypted/ACL/xattr/special-bit rejection
    - safe path/depth/metadata/entry/ratio/exact-expanded-byte limits
    - duplicate/case collision/file-directory collision and implicit parent behavior
    - exact entry declared/actual byte agreement, output streaming, cancellation/deadline
    - archive capability same-object/metadata/path binding after expansion
    - failure cleanup preserves primary error
  archive_native:
    - hostile destination/ancestor/final path substitution
    - create-new semantics, no-follow component handling, file flush/directory durability
    - Windows reserved/case aliases and Linux case-distinct behavior
    - exact private-root cleanup on injected failures
    - Windows/Linux native evidence
  integration:
    - catalog artifact missing type or size zero rejected under current v1 validation
    - archive expanded bytes equal trusted component installed_bytes
    - file-set caller delegates ordered source fallback to ArtifactAcquirer
    - old acquire_artifact/extract_archive/shared partial/caller-source-loop no longer normal authority after joint TX-07
    - component semantic validator remains unchanged and green

delegation_stop_conditions:
  - acquisition needs a pathname reopen after an exact capability is available
  - a source type other than HTTPS/catalog-relative is required by current trusted media
  - safe v1 implementation would require persistent resume state/shared partial files
  - valid cache target would have to be overwritten/deleted
  - cache mutation cannot classify post-activation target truthfully
  - archive producer requires a non-tar/gzip format under current v1 media
  - libarchive would need archive_read_extract/archive_write_disk pathname authority
  - target path collision semantics cannot fit the neutral collision key
  - an archive special object/metadata must be restored for current package correctness
  - component semantic validation, transaction, layout, provider, or release-planner ownership must move into #8
  - another repository must change

completion: >
  Issue #8 completes only when ACQ-01 through ACQ-03 and ARC-01 through ARC-03
  plus the joint #8/#9 TX-07 integration are merged; every normal artifact/file-
  set source reaches staging through ArtifactAcquirer; archive artifacts are read
  from admitted cache capabilities and expanded only through ArchiveExpander;
  shared resumable partials, path-based cache trust, broad libarchive format/
  output authority, and caller-level source fallback are no longer normal paths.