meta:
  spec_id: arena_suite_lego_boundaries_v1
  version: 3
  status: active
  owner: suite_architecture

authority_document: docs/architecture/UCI_ARENA_COMPLETE_LEGO_ARCHITECTURE.md
mandatory_companion_documents:
  - docs/architecture/UCI_ARENA_MOVE_TIME_AUTHORITY.md
authority_relationship:
  rule: >
    UCI_ARENA_COMPLETE_LEGO_ARCHITECTURE.md remains the broad suite topology
    authority. UCI_ARENA_MOVE_TIME_AUTHORITY.md is the more-specific authority
    for move-time ownership, timing-policy production/application, clock and
    useful-block authority, transport timing, and timing applicability. If broad
    legacy wording can be read as assigning conflicting move-time semantics, the
    more-specific companion controls.

repository_role:
  name: uci-arena-installer
  owns:
    - suite_composition
    - artifact_and_provenance_verification
    - installation_lifecycle
    - preservation_backup_and_rollback
    - windows_and_linux_release_assembly
  must_not_own:
    - engine_behavior
    - manager_control_plane_behavior
    - lichess_bot_behavior
    - book_production_behavior
    - evidence_production_behavior
    - move_time_allocation_strategy
    - timing_policy_semantics
    - live_game_clock_authority

mandatory_boundaries:
  - Provider inputs are immutable artifacts, manifests, checksums, provenance,
    versions, and compatibility declarations; provider source and build trees
    are forbidden inputs.
  - Product or model names never select installer mechanism behavior. Package
    knowledge belongs to component manifests and composition data.
  - Engine-owned managed launch profiles use the same declared
    installer-integration contract as any other component configuration.
    Installer resolves typed paths and persists results but never interprets
    UCI, timing, model, book, or tablebase semantics.
  - Timing-policy artifacts are installed and wired as owner-declared versioned
    artifacts. Installer never interprets minimum useful timing blocks,
    allocation-strategy parameters, live clock pressure, or move applicability.
  - Engine chess-time policy, Evidence policy-production authority, and Lichess
    transport/API timing remain distinct suite responsibilities even when a
    composition binds all three into one installed product.
  - Existing timing-profile/temporal-curve schemas retain their declared meaning;
    a new move-time policy contract requires explicit versioned compatibility and
    may not be inferred from filenames or field similarity.
  - A new installable component changes its provider manifest and product
    composition, not installer orchestration control flow.
  - Cross-repository calls use versioned project-owned contracts and typed
    operations; private SDK, storage, and arbitrary shell contracts are forbidden.
  - The full target document and mandatory move-time companion are authoritative
    together, with the move-time companion controlling within its narrower scope.

governing_tests:
  - arbitrary_component_identity_substitution
  - provider_source_tree_absence
  - manifest_driven_composition
  - transactional_install_repair_upgrade_uninstall
  - rollback_and_preservation
  - timing_policy_artifact_semantic_opacity
