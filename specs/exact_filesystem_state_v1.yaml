  DP-03, and TJ-01 through TJ-02 are integrated; trust paths hash, verify, and
  parse exact admitted bytes; rollback state uses truthful durable publication;
  canonical signatures use the declared POUF; and dependent issues have not
  created competing identity, exact-read, or publication mechanisms.
