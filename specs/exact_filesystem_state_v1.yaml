meta:
  spec_id: arena_exact_filesystem_state_v1
  version: 1
  status: active
  owner: exact_filesystem_state
  parent_issue: 7

authority_relationship: >
  This specification is the specialized active authority for physical filesystem
  identity, exact immutable document admission, bounded JSON parsing, durable
  authoritative-state publication, and exact-byte TUF trust consumption. It
  complements the installation contract and issue #9 transaction architecture;
  it does not become the semantic owner of receipts, journals, layouts, removal,
  acquisition, or provider state.

purpose: >
  Ensure that Installer verifies, interprets, publishes, and later reuses the
  exact same physical bytes and filesystem objects it admitted. Pathnames are
  locators, not identity. A failed publication never destroys the prior
  authority, and a post-activation durability failure is reported truthfully
  rather than disguised as a pre-activation failure.

references:
  tuf_specification: https://theupdateframework.github.io/specification/latest/
  tuf_reference_json_serializer: https://github.com/theupdateframework/python-tuf/blob/develop/tuf/api/serialization/json.py
  olpc_canonical_json_reference: https://github.com/secure-systems-lab/securesystemslib/blob/main/securesystemslib/formats.py
  windows_create_file: https://learn.microsoft.com/windows/win32/api/fileapi/nf-fileapi-createfilew
  windows_file_information: https://learn.microsoft.com/windows/win32/api/winbase/nf-winbase-getfileinformationbyhandleex
  windows_move_file: https://learn.microsoft.com/windows/win32/api/winbase/nf-winbase-movefileexw
  posix_open: https://pubs.opengroup.org/onlinepubs/9799919799/functions/open.html
  posix_rename: https://pubs.opengroup.org/onlinepubs/9799919799/functions/rename.html

hierarchy:
  lego:
    bricks:
      - name: FilesystemIdentity
        owns:
          - no-follow physical admission of regular files and directories
          - stable open-object identity and metadata observations
          - descriptor-bound reading
          - re-observation of the open object
          - re-observation of whether the original path still names that object
          - exact child admission relative to an admitted directory
        replacement_boundary: platform adapter family
        failure_boundary: physical admission, identity, or descriptor I/O failure
        does_not_own:
          - JSON or TUF semantics
          - byte-size policy for a document role
          - state serialization or activation policy
          - download, extraction, transaction, layout, or deletion policy
      - name: ExactDocumentReader
        owns:
          - bounded one-pass read from an admitted regular-file capability
          - SHA-256 over the exact returned byte buffer
          - before/after object and path-binding verification
          - bounded duplicate-rejecting JSON interpretation from those same bytes
        replacement_boundary: document/JSON reader implementation
        failure_boundary: byte admission, stability, digest, or bounded parse failure
        does_not_own:
          - filesystem-native identity mechanisms
          - TUF role semantics or signature policy
          - durable publication
          - generic application configuration meaning
      - name: DurableStatePublisher
        owns:
          - authoritative state publication request/result semantics
          - explicit prior-state precondition
          - per-target writer serialization
          - random private same-directory staging
          - candidate write, flush, exact reread, and digest verification
          - atomic target activation
          - post-activation exact verification and durability evidence
          - truthful activation outcome and bounded cleanup evidence
        replacement_boundary: platform publication adapter family
        failure_boundary: lock, staging, activation, durability, verification, or cleanup failure
        does_not_own:
          - meaning of the published state
          - transaction commit or rollback
          - receipt, journal, layout, trust, or preservation schemas
          - arbitrary generated-file writing
      - name: TufJsonTrust
        owns:
          - the Installer TUF JSON POUF
          - OLPC canonical serialization of the signed object
          - exact-document use for root, timestamp, snapshot, targets, and catalog
          - exact rollback-state admission and publication
          - exact retained-development-trust admission
        replacement_boundary: TUF trust consumer implementation
        failure_boundary: canonicalization, signature, role, rollback, expiry, or exact-byte mismatch
        does_not_own:
          - remote signing service or release provenance producer policy
          - TUF repository generation
          - artifact download or installation transaction policy
    topology_rule: >
      These are separate LEGO bricks because physical identity, immutable
      interpretation, durable mutation, and TUF trust have different owners,
      consumers, replacement conditions, and failure consequences. They share
      narrow ports; they must not collapse into one unbounded filesystem utility.
      Conversely, each brick remains one coherent unit and must not be split into
      registries or action-specific public services without a proven lifecycle,
      ownership, replacement, or failure boundary.
  solid:
    filesystem_identity:
      single_responsibility: expose exact physical object capabilities only
      open_closed: a platform adds one adapter without changing consumers
      liskov: all adapters expose identical identity, binding, and read semantics
      interface_segregation: callers receive read-only file/directory capabilities, not native handles
      dependency_inversion: ExactDocumentReader depends on the neutral identity port
    exact_document:
      single_responsibility: return one stable bounded byte document and optionally one bounded JSON value
      open_closed: role-specific limits are data, not alternate readers
      liskov: every accepted document hashes and parses the same byte buffer
      interface_segregation: byte reading and JSON parsing are separate operations on the same document
      dependency_inversion: native path behavior remains behind FilesystemIdentity
    durable_publisher:
      single_responsibility: compare, stage, activate, verify, and report one state-file publication
      open_closed: a platform adds one adapter behind the same publication contract
      liskov: every adapter honors identical preconditions and outcome truth
      interface_segregation: semantic owners submit bytes/preconditions and receive evidence only
      dependency_inversion: semantic owners depend on DurableStatePublisher, not rename/temp-file APIs
    tuf_trust:
      single_responsibility: verify the existing Installer TUF JSON trust chain over exact documents
      open_closed: new roles or a different POUF require an explicit versioned trust contract
      liskov: canonical bytes match the declared OLPC JSON POUF across implementations
      interface_segregation: TUF policy sees exact documents and durable publication, never raw path helpers
      dependency_inversion: TUF trust depends on ExactDocumentReader and DurableStatePublisher
  cupid:
    - composable through admitted capabilities and fixed request/result value types
    - unix-like helpers each admit, read, parse, canonicalize, stage, activate, or verify one thing
    - predictable identity, byte bounds, preconditions, outcomes, and diagnostics
    - idiomatic C++20 RAII plus native platform APIs behind adapters
    - domain-based names describe identity, exact documents, publication, and TUF trust
  kiss: >
    Use the least complex complete implementation inside the fixed bricks and
    interfaces. KISS may not reopen a pathname, replace descriptor identity with
    lexical checks, use predictable staging, delete the prior authority before
    replacement, collapse post-activation uncertainty into ordinary failure, or
    substitute generic JSON dumping for the declared TUF canonical format.

shared_bounds:
  path_utf8_bytes: 131072
  leaf_utf8_bytes: 4096
  diagnostic_code_bytes: 64
  diagnostic_message_utf8_bytes: 512
  sha256_hex_bytes: 64
  identity_token_bytes: 32
  exact_document_global_max_bytes: 67108864
  publication_global_max_bytes: 67108864
  operation_timeout_minimum: 1ms
  operation_timeout_maximum: 120s

filesystem_identity:
  public_header: include/arena/ports/filesystem_identity.hpp
  common_implementation: src/adapters/filesystem_identity.cpp
  platform_factory_header: include/arena/platform/filesystem_identity.hpp
  platform_implementations:
    windows: src/platform/windows/filesystem_identity.cpp
    linux: src/platform/linux/filesystem_identity.cpp
  namespace: arena::ports
  cxx_shape: |
    enum class FilesystemObjectKind {
        regular_file,
        directory,
    };

    enum class PathBindingState {
        same_object,
        missing,
        different_object,
        uninspectable,
    };

    enum class FilesystemIdentityErrorCode {
        invalid_path,
        missing,
        wrong_kind,
        link_or_reparse,
        special_object,
        access_denied,
        identity_unavailable,
        identity_changed,
        io_failure,
    };

    using FilesystemIdentityToken = std::array<std::byte, 32>;

    struct FilesystemObservation {
        FilesystemObjectKind kind;
        std::uint64_t size_bytes;
        FilesystemIdentityToken object_identity;
        FilesystemIdentityToken metadata_identity;
    };

    class FilesystemIdentityException final : public std::runtime_error {
      public:
        FilesystemIdentityException(
            FilesystemIdentityErrorCode code,
            std::string message);
        [[nodiscard]] FilesystemIdentityErrorCode code() const noexcept;
    };

    class AdmittedRegularFile {
      public:
        virtual ~AdmittedRegularFile() = default;
        [[nodiscard]] virtual const std::filesystem::path& absolute_path() const noexcept = 0;
        [[nodiscard]] virtual const FilesystemObservation& initial_observation() const noexcept = 0;
        [[nodiscard]] virtual std::size_t read_at(
            std::uint64_t offset,
            std::span<std::byte> destination) = 0;
        [[nodiscard]] virtual FilesystemObservation observe_open_object() const = 0;
        [[nodiscard]] virtual PathBindingState observe_path_binding() const = 0;
    };

    class AdmittedDirectory {
      public:
        virtual ~AdmittedDirectory() = default;
        [[nodiscard]] const std::filesystem::path& absolute_path() const noexcept;
        [[nodiscard]] const FilesystemObservation& initial_observation() const noexcept;
        [[nodiscard]] std::unique_ptr<AdmittedRegularFile>
        open_regular_file(std::string_view leaf) const;
        [[nodiscard]] std::unique_ptr<AdmittedDirectory>
        open_directory(std::string_view leaf) const;
        [[nodiscard]] virtual FilesystemObservation observe_open_object() const = 0;
        [[nodiscard]] virtual PathBindingState observe_path_binding() const = 0;
      protected:
        AdmittedDirectory(std::filesystem::path, FilesystemObservation);
        [[nodiscard]] virtual std::unique_ptr<AdmittedRegularFile>
        open_regular_file_validated(std::string_view leaf) const = 0;
        [[nodiscard]] virtual std::unique_ptr<AdmittedDirectory>
        open_directory_validated(std::string_view leaf) const = 0;
    };

    class FilesystemIdentity {
      public:
        virtual ~FilesystemIdentity() = default;
        [[nodiscard]] std::unique_ptr<AdmittedRegularFile>
        admit_regular_file(const std::filesystem::path& absolute_path);
        [[nodiscard]] std::unique_ptr<AdmittedDirectory>
        admit_directory(const std::filesystem::path& absolute_path);
      protected:
        [[nodiscard]] virtual std::unique_ptr<AdmittedRegularFile>
        admit_regular_file_validated(const std::filesystem::path& absolute_path) = 0;
        [[nodiscard]] virtual std::unique_ptr<AdmittedDirectory>
        admit_directory_validated(const std::filesystem::path& absolute_path) = 0;
    };
  platform_factory_shape: |
    namespace arena::platform {
    [[nodiscard]] std::unique_ptr<arena::ports::FilesystemIdentity>
    make_filesystem_identity();
    }
  common_enforcement:
    owner: src/adapters/filesystem_identity.cpp
    responsibilities:
      - require absolute lexically normalized paths
      - reject embedded NUL, CR, LF, and the neutral path safety budget
      - require child names to be one nonempty leaf, not dot/dot-dot or a separator-containing path
      - preserve typed bounded errors from adapters
      - reject an adapter result whose initial kind differs from the requested kind
    exception_policy: >
      Admission and descriptor I/O failures throw FilesystemIdentityException.
      Callers may branch only on its neutral error code, never platform error numbers.
  observation_contract:
    object_identity: >
      Opaque domain-separated SHA-256 of stable platform object identity. It is
      comparable only for equality within a platform/filesystem lifetime. POSIX
      native device/inode and Windows volume/file-id values never cross the port.
    metadata_identity: >
      Opaque domain-separated SHA-256 of object identity plus the platform's
      stable size/type/change observations. It detects observed mutation but is
      not a substitute for hashing document bytes.
    directory_size: 0
    rule: >
      Failure to obtain stable native object identity is admission failure; the
      adapter must not fall back to pathname, timestamp alone, or file content.
  admitted_file_contract:
    - read_at is descriptor/handle-bound and never reopens the path
    - reads are 64-bit-offset-safe and return zero only at observed EOF
    - observe_open_object uses the same open descriptor/handle
    - observe_path_binding re-resolves every recorded path component no-follow and compares object identities
    - path binding inspection errors return uninspectable, not same_object
  admitted_directory_contract:
    - the directory is admitted component-by-component with no-follow semantics
    - legitimate mount boundaries are allowed, but recorded ancestor identity changes are binding failure
    - child admission is relative to the admitted directory capability
    - open_regular_file and open_directory accept exactly one leaf component
    - all opened ancestors and child objects are RAII-owned
  windows_rules:
    - use extended-length absolute paths
    - open every existing component with CreateFileW and FILE_FLAG_OPEN_REPARSE_POINT
    - use FILE_FLAG_BACKUP_SEMANTICS for directories
    - inspect FileAttributeTagInfo and reject every reparse point
    - obtain FileIdInfo, FileBasicInfo, and FileStandardInfo from the open handle
    - reject devices, pipes, directories-as-files, files-as-directories, and unsupported object identity
    - path-binding re-observation compares recorded volume/file ids for every component
  linux_rules:
    - open the absolute root and every later component with openat and O_NOFOLLOW
    - use O_DIRECTORY for directories and reject non-regular leaf files
    - use fstat on open descriptors; object identity derives from st_dev and st_ino
    - metadata observation includes type, size, mode, link count, mtime, and ctime with nanosecond fields when available
    - path-binding re-observation traverses again with openat and compares every recorded device/inode pair
    - do not use stat on the final pathname as identity authority

exact_document_reader:
  public_header: include/arena/application/installer/exact_document.hpp
  implementation: src/application/installer/exact_document.cpp
  namespace: arena::application::installer
  cxx_shape: |
    struct ExactDocumentLimits {
        std::uint64_t maximum_bytes;
        bool require_nonempty{true};
    };

    struct ExactDocument {
        std::vector<std::byte> bytes;
        std::string sha256;
        arena::ports::FilesystemObservation initial_observation;
        arena::ports::FilesystemObservation final_observation;
    };

    struct BoundedJsonLimits {
        std::size_t maximum_depth;
        std::size_t maximum_values;
        std::size_t maximum_object_members;
        std::size_t maximum_array_items;
        std::size_t maximum_key_utf8_bytes;
        std::size_t maximum_string_utf8_bytes;
        bool allow_floating_point{false};
    };

    class ExactDocumentReader final {
      public:
        explicit ExactDocumentReader(arena::ports::FilesystemIdentity& identity);
        [[nodiscard]] ExactDocument read_child(
            const arena::ports::AdmittedDirectory& directory,
            std::string_view leaf,
            const ExactDocumentLimits& limits) const;
    };

    [[nodiscard]] nlohmann::json parse_bounded_json(
        const ExactDocument& document,
        const BoundedJsonLimits& limits);
  read_contract:
    - maximum_bytes is nonzero and no greater than the global maximum
    - require the admitted parent directory path binding before child open
    - read with bounded fixed-size chunks using read_at
    - request at most maximum_bytes plus one byte to detect overflow
    - hash the exact accumulated bytes, not the pathname
    - reobserve the open file and require object identity, metadata identity, kind, and size to remain unchanged
    - require bytes read to equal the stable observed size
    - require both file and parent directory path binding to remain same_object after the read
    - close capabilities through RAII on every path
    - preserve the primary failure separately from any bounded cleanup observation
  json_contract:
    parser: nlohmann SAX construction with explicit limit enforcement
    - consume only ExactDocument.bytes
    - require valid UTF-8
    - reject duplicate object keys at every depth
    - reject depth, total-value, per-object-member, per-array-item, key, or string limit overflow before unbounded allocation
    - reject floating point unless the caller explicitly permits it
    - reject discarded/binary/unsupported values
    - produce bounded diagnostics without echoing document contents
  default_json_limits:
    maximum_depth: 64
    maximum_values: 1000000
    maximum_object_members: 100000
    maximum_array_items: 100000
    maximum_key_utf8_bytes: 4096
    maximum_string_utf8_bytes: 1048576
    allow_floating_point: false

durable_state_publisher:
  public_header: include/arena/ports/durable_state_publisher.hpp
  common_implementation: src/adapters/durable_state_publisher.cpp
  platform_factory_header: include/arena/platform/durable_state_publisher.hpp
  platform_implementations:
    windows: src/platform/windows/durable_state_publisher.cpp
    linux: src/platform/linux/durable_state_publisher.cpp
  namespace: arena::ports
  cxx_shape: |
    enum class PublicationPrecondition {
        absent,
        exact_sha256,
    };

    enum class PublicationOutcome {
        activated,
        not_activated,
        activated_durability_unproven,
        indeterminate,
    };

    struct PublicationDiagnostic {
        std::string code;
        std::string message;
    };

    struct PublicationRequest {
        std::filesystem::path target;
        std::span<const std::byte> bytes;
        std::uint64_t maximum_bytes;
        PublicationPrecondition precondition;
        std::optional<std::string> expected_prior_sha256;
        std::chrono::milliseconds timeout;
    };

    struct PublicationResult {
        PublicationOutcome outcome;
        std::uint64_t candidate_size_bytes;
        std::string candidate_sha256;
        std::optional<std::string> prior_sha256;
        std::optional<std::string> observed_target_sha256;
        std::optional<PublicationDiagnostic> primary_diagnostic;
        std::vector<PublicationDiagnostic> cleanup_diagnostics;
    };

    class DurableStatePublisher {
      public:
        virtual ~DurableStatePublisher() = default;
        [[nodiscard]] PublicationResult publish(const PublicationRequest& request);
      protected:
        [[nodiscard]] virtual PublicationResult publish_validated(
            const PublicationRequest& request,
            std::string_view candidate_sha256,
            std::string_view random_stage_id,
            std::chrono::steady_clock::time_point deadline) = 0;
    };
  platform_factory_shape: |
    namespace arena::platform {
    [[nodiscard]] std::unique_ptr<arena::ports::DurableStatePublisher>
    make_durable_state_publisher();
    }
  common_enforcement:
    - require an absolute lexically normalized target with one valid leaf and bounded UTF-8 path
    - require nonempty bytes, maximum_bytes within the global bound, and bytes.size not exceeding maximum_bytes
    - require exact_sha256 to carry one lowercase 64-hex prior digest and absent to carry none
    - bound timeout to the shared range
    - hash candidate bytes once in common code
    - generate a cryptographically random 128-bit lowercase-hex stage id
    - capture one steady-clock deadline exactly once
    - validate platform result candidate identity, diagnostics, and outcome invariants
    - convert ordinary adapter exceptions into indeterminate only when activation state cannot be proven; otherwise not_activated
  precondition_contract:
    absent: target must be physically absent while the per-target lease is held
    exact_sha256: >
      target must be an exact admitted regular file whose descriptor-bound digest
      equals expected_prior_sha256 while the per-target lease is held
    rule: >
      There is no unconditional authoritative-state overwrite. A semantic owner
      must explicitly prove absence or bind replacement to the prior exact bytes.
  platform_operation_contract:
    - admit every parent component no-follow and reject ancestor substitution
    - verify authoritative parent is not writable by untrusted principals according to platform policy
    - derive a persistent per-target lock leaf from a domain-separated SHA-256 of the target leaf
    - validate/open the lock no-follow as a private regular file and acquire an exclusive bounded OS lock
    - keep the lock through precondition, staging, activation, post-verification, and cleanup decision
    - create a random same-directory staging leaf exclusively with private permissions
    - write all candidate bytes, flush the file, close it, reopen it exactly, and verify size/digest
    - activate within the same directory using the platform's atomic replace/no-replace operation
    - never delete the prior target before atomic activation
    - reopen the target exactly and verify candidate size/digest after activation
    - perform the strongest supported directory/rename durability operation
    - remove only the exact staging object created by this publication
    - collect cleanup failures without hiding the primary outcome
  outcome_contract:
    activated:
      - atomic activation succeeded
      - exact post-open target digest equals candidate
      - required file and directory durability operations succeeded
    not_activated:
      - adapter proves atomic activation did not occur
      - prior authority remains or target remains absent according to precondition
    activated_durability_unproven:
      - adapter proves target currently equals candidate
      - activation occurred
      - a required post-activation durability operation failed or is unsupported
    indeterminate:
      - adapter cannot prove whether the target names candidate, prior bytes, or another object
    rules:
      - only activated is semantic success
      - activated_durability_unproven and indeterminate must never be rewritten as ordinary not_activated
      - callers must preserve the outcome for recovery and operator evidence
      - a failed cleanup after activated remains activated with cleanup diagnostics
  diagnostics:
    code_pattern: '^[A-Za-z0-9_.:-]+$'
    fixed_common_codes:
      - invalid_request
      - adapter_exception
      - adapter_contract_violation
    secrets: forbidden
  windows_rules:
    - use CreateFileW with extended paths and reparse-point rejection for parent, lock, staging, prior target, and post-target
    - inspect stable FileIdInfo/FileBasicInfo/FileStandardInfo identities
    - use an OS byte-range/file lock on the validated lock handle
    - create staging with CREATE_NEW and private/inherited authoritative ACL
    - use FlushFileBuffers for staging and post-activation target handles
    - use MoveFileExW without REPLACE_EXISTING for absent and with REPLACE_EXISTING plus MOVEFILE_WRITE_THROUGH for exact replacement
    - re-open and verify target after MoveFileExW
    - if activation is proven but write-through/post-flush proof fails, return activated_durability_unproven
    - do not use unsupported REPLACEFILE_WRITE_THROUGH as durability proof
  linux_rules:
    - use openat/O_NOFOLLOW relative to an admitted parent directory
    - require parent ownership by effective uid or root and reject group/other write authority for untrusted principals
    - use flock or fcntl locking on the validated persistent lock file
    - create staging with openat O_CREAT|O_EXCL|O_NOFOLLOW mode 0600
    - fsync staging before activation
    - use renameat2 RENAME_NOREPLACE for absent; fail closed if the kernel/filesystem cannot provide no-replace semantics
    - use renameat for exact replacement while the authoritative per-target lease is held
    - fsync the parent directory after activation
    - re-open and verify target before reporting activated
    - directory fsync failure after proven activation returns activated_durability_unproven

tuf_json_trust:
  implementation_files:
    canonical_header: include/arena/application/installer/tuf_canonical_json.hpp
    canonical_source: src/application/installer/tuf_canonical_json.cpp
    trust_consumer: src/application/installer/setup.cpp
  pouf:
    id: arena_tuf_olpc_canonical_json_v1
    signed_bytes: >
      UTF-8 OLPC Canonical JSON serialization of the metadata top-level
      `signed` object only. The full wire metadata file may contain arbitrary
      permitted whitespace; signatures never cover its `signatures` array.
    allowed_types:
      - object with string keys
      - array
      - string
      - signed or unsigned integer representable by nlohmann JSON integer storage
      - true
      - false
      - null
    forbidden_types:
      - floating point
      - binary
      - discarded
    object_order: ascending Unicode scalar/string order matching the reference encoder for valid UTF-8 keys
    whitespace: none
    string_encoding:
      - output valid UTF-8 bytes unchanged
      - escape backslash as double backslash
      - escape quote as backslash quote
      - reject U+0000 through U+001F rather than emitting invalid canonical JSON
    integers: base-10 with no leading plus, whitespace, or redundant leading zero
    rule: >
      Generic nlohmann json.dump() is not canonicalization authority even if a
      current map happens to be sorted. The dedicated encoder must reject every
      unsupported value explicitly.
  reference_vectors:
    - input: ''
      output: '""'
    - input: [1, 2, 3]
      output: '[1,2,3]'
    - input: []
      output: '[]'
    - input: {}
      output: '{}'
    - input: {A: [99]}
      output: '{"A":[99]}'
    - input: {A: true}
      output: '{"A":true}'
    - input: {B: false}
      output: '{"B":false}'
    - input: {x: 3, y: 2}
      output: '{"x":3,"y":2}'
    - input: {x: 3, y: null}
      output: '{"x":3,"y":null}'
    - input_string: '"'
      output: '"\""'
    - input_string: '\'
      output: '"\\"'
    - rejects: floating_point
  role_document_limits:
    root:
      maximum_bytes: 4194304
      maximum_values: 100000
    timestamp:
      maximum_bytes: 1048576
      maximum_values: 50000
    snapshot:
      maximum_bytes: 8388608
      maximum_values: 1000000
    targets:
      maximum_bytes: 16777216
      maximum_values: 1000000
    catalog:
      maximum_bytes: 33554432
      maximum_values: 1000000
    rollback_state:
      maximum_bytes: 1048576
      maximum_values: 50000
    retained_development_trust:
      maximum_bytes: 1048576
      maximum_values: 50000
  exact_chain_contract:
    - admit metadata directory once and read root, timestamp, snapshot, and targets as exact children
    - hash and parse each exact document once; never reopen a role pathname
    - compare timestamp-described snapshot length/hash to ExactDocument size/digest
    - compare snapshot-described targets length/hash to ExactDocument size/digest
    - admit catalog parent and read catalog once; compare targets description to its exact size/digest
    - verify signatures over dedicated canonical bytes of the parsed signed object
    - compute pinned root digest from ExactDocument bytes
    - reject duplicate JSON keys and unsupported canonical types before signature verification
    - retain existing TUF role/threshold/expiry/version semantics unless separately specified
  rollback_state_contract:
    - exact-read prior rollback state if present
    - parse from the exact bytes under rollback-state limits
    - compare role versions as today
    - serialize the next bounded JSON state deterministically
    - publish through DurableStatePublisher with absent or exact prior digest precondition
    - accept only PublicationOutcome::activated
    - preserve activated_durability_unproven or indeterminate in the thrown/structured failure evidence
  retained_development_trust_contract:
    - admit the retained release directory and exact-read catalog.json and development-trust.json
    - compare development-trust catalog_sha256 to the exact catalog document digest
    - never hash then reopen either path
    - creation/activation of the surrounding retained release-media directory remains its current separate lifecycle owner; issue #7 does not create a second release-media transaction
  direct_migration_boundary:
    migrate_now:
      - official TUF root/timestamp/snapshot/targets/catalog admission and verification
      - TUF rollback-state read and publication
      - retained development catalog/trust exact admission
    explicitly_deferred_to_other_owners:
      - install transaction journal publication: issue 9
      - install receipts and component activation state: issue 9
      - uninstall/purge preservation records: issue 10
      - installed-layout descriptor: issue 80
      - artifact cache/download staging: issue 8
      - generated provider configuration and locator files: their lifecycle owner and issue 9
    transitional_rule: >
      Existing read_json, sha256_file, and write_json_atomic helpers may remain for
      deferred consumers, but no migrated trust path may call them. Issue #7 must
      not broaden into every JSON read/write in setup.cpp.

validation:
  test_files:
    filesystem_identity: tests/unit/filesystem_identity_tests.cpp
    exact_document: tests/unit/exact_document_tests.cpp
    durable_publication: tests/unit/durable_state_publisher_tests.cpp
    tuf_trust: tests/unit/tuf_trust_tests.cpp
    existing_integration: tests/unit/setup_tests.cpp
  required_filesystem_cases:
    - invalid relative/non-normalized/oversized/control-containing path
    - missing, wrong kind, symlink, junction/reparse, device/FIFO/socket/special object
    - permission and inspection failure
    - regular file and directory stable observation
    - descriptor read remains bound after pathname replacement
    - path binding reports different_object after replacement
    - ancestor replacement reports different_object or uninspectable
    - child leaf rejects separators and dot/dot-dot
    - legitimate mount boundary is admitted while later mount/ancestor identity change is detected
    - opaque object identity is stable for the same open object and differs for replacement
  required_document_cases:
    - empty policy, exact maximum, one-byte overflow, truncation, and growth
    - replacement before open, during read, and after read
    - same-size mutation
    - parent path rebinding
    - digest matches exact returned bytes
    - read/close/reobserve primary versus cleanup failure preservation
    - invalid UTF-8, duplicate keys, depth/value/member/item/key/string overflow
    - float rejection and optional explicit float acceptance
    - no pathname reopen between hash and parse
  required_publication_cases:
    - absent precondition success and occupied failure
    - exact prior digest success and mismatch failure
    - hostile target/stage/lock link or reparse substitution
    - staging collision, partial write, staging flush, reread, and digest failure
    - writer lock contention and timeout
    - atomic activation failure before mutation returns not_activated
    - proven activation plus durability failure returns activated_durability_unproven
    - unprovable post-state returns indeterminate
    - cleanup failure never rewrites activated/not-activated truth
    - concurrent legitimate writers serialize and stale precondition loses safely
    - prior authority survives every pre-activation failure
    - exact candidate digest/size and bounded diagnostics
  required_tuf_cases:
    - OLPC canonical reference vectors and object-key ordering
    - quote/backslash escaping, UTF-8 preservation, integer bounds, control and float rejection
    - comparison vectors generated by the current securesystemslib reference implementation
    - root substitution between former hash/open points
    - timestamp, snapshot, targets, and catalog substitution at every former check/open point
    - same-size mutation and duplicate-key metadata
    - canonicalization mismatch causes signature failure
    - signature threshold counts each key id once
    - rollback-state absent/exact publication, precondition conflict, durability-unproven, and indeterminate outcomes
    - retained development trust binds exact catalog bytes
    - source search proves migrated trust code does not call legacy path hash/read/write helpers

implementation_slices:
  - id: FI-01
    goal: add neutral FilesystemIdentity types/template-method validation and fake-capability tests
    may_touch:
      - include/arena/ports/filesystem_identity.hpp
      - include/arena/platform/filesystem_identity.hpp
      - src/adapters/filesystem_identity.cpp
      - tests/unit/filesystem_identity_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - platform-native adapters
      - exact document, publisher, TUF, or SetupEngine code
  - id: FI-02
    goal: implement Windows filesystem identity/capabilities and native focused tests
    prerequisite: FI-01
    may_touch:
      - src/platform/windows/filesystem_identity.cpp
      - tests/unit/filesystem_identity_tests.cpp
      - private Windows identity support files if strictly necessary
      - CMakeLists.txt
  - id: FI-03
    goal: implement Linux filesystem identity/capabilities and native focused tests
    prerequisite: FI-01
    may_touch:
      - src/platform/linux/filesystem_identity.cpp
      - tests/unit/filesystem_identity_tests.cpp
      - private Linux identity support files if strictly necessary
      - CMakeLists.txt
  - id: ED-01
    goal: implement ExactDocumentReader, bounded duplicate-rejecting JSON parser, and fake identity tests
    prerequisite: FI-01
    may_touch:
      - include/arena/application/installer/exact_document.hpp
      - src/application/installer/exact_document.cpp
      - tests/unit/exact_document_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - TUF semantics
      - durable publication
      - SetupEngine
  - id: DP-01
    goal: add neutral DurableStatePublisher request/result/template-method enforcement and fake-adapter tests
    may_touch:
      - include/arena/ports/durable_state_publisher.hpp
      - include/arena/platform/durable_state_publisher.hpp
      - src/adapters/durable_state_publisher.cpp
      - tests/unit/durable_state_publisher_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - platform publication adapters
      - semantic state consumers
  - id: DP-02
    goal: implement Windows durable state publisher and native focused tests
    prerequisite: DP-01
    may_touch:
      - src/platform/windows/durable_state_publisher.cpp
      - tests/unit/durable_state_publisher_tests.cpp
      - private Windows publication support files if strictly necessary
      - CMakeLists.txt
  - id: DP-03
    goal: implement Linux durable state publisher and native focused tests
    prerequisite: DP-01
    may_touch:
      - src/platform/linux/durable_state_publisher.cpp
      - tests/unit/durable_state_publisher_tests.cpp
      - private Linux publication support files if strictly necessary
      - CMakeLists.txt
  - id: TJ-01
    goal: implement the dedicated OLPC canonical JSON encoder and reference-vector tests
    may_touch:
      - include/arena/application/installer/tuf_canonical_json.hpp
      - src/application/installer/tuf_canonical_json.cpp
      - tests/unit/tuf_trust_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - TUF chain caller
      - generic document or publication contracts
  - id: TJ-02
    goal: migrate official TUF, rollback state, and retained development trust to exact documents/publication
    prerequisites: [FI-02, FI-03, ED-01, DP-02, DP-03, TJ-01]
    may_touch:
      - src/application/installer/setup.cpp
      - include/arena/application/installer/setup.hpp only if required to hold composed ports without transaction redesign
      - tests/unit/tuf_trust_tests.cpp
      - tests/unit/setup_tests.cpp
      - CMakeLists.txt
    must_not_touch:
      - download/archive code
      - install transaction phases, receipts, general journals, rollback, or recovery
      - removal, layout, provider lifecycle, release provenance, or another repository

delegation_stop_conditions:
  - a native handle, platform object id, or platform error must cross a neutral port
  - path lexical comparison appears necessary as identity authority
  - a public mutation method is proposed on the read-only filesystem identity capability
  - exact document hashing and parsing would use different byte buffers
  - duplicate JSON keys or structural bounds cannot be enforced as specified
  - publication requires unconditional overwrite or deleting the prior target first
  - platform behavior cannot distinguish not_activated from post-activation uncertainty
  - a TUF format other than the declared OLPC JSON POUF is required by current signed media
  - a semantic receipt/journal/layout/removal/download owner must change
  - platform-native validation cannot be tested on its platform

completion: >
  Issue #7 completes only when FI-01 through FI-03, ED-01, DP-01 through
  DP-03, and TJ-01 through TJ-02 are integrated; official and retained trust
  paths hash, verify, and parse exact admitted bytes; rollback trust state uses
  truthful durable publication; canonical signatures use the declared POUF; and
  no dependent issue has created a competing identity, exact-read, or
  authoritative-publication mechanism.
