delegation_stop_conditions:
  - native handle, platform object id, or platform error must cross a neutral port
  - lexical path comparison appears necessary as identity authority
  - a mutation method is proposed on read-only FilesystemIdentity capability
  - hashing and parsing would use different buffers
  - duplicate keys or structural bounds cannot be enforced
  - publication needs unconditional overwrite or prior-target deletion
  - platform cannot distinguish pre-activation failure from post-activation uncertainty
  - current signed media requires a POUF other than declared OLPC JSON
  - semantic receipt/journal/layout/removal/download ownership must change
  - platform-native behavior cannot be tested on that platform

