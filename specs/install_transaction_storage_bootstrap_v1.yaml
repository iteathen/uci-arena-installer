meta:
  spec_id: arena_install_transaction_storage_bootstrap_v1
  version: 1
  status: active
  owner: install_transaction
  parent_issue: 9
  specializes: arena_install_transaction_v2
  required_by_issue: 80

authority_relationship: >
  Close the pre-journal storage gap for layout initialization without adding a
  second transaction owner. The caller may supply one exact existing bootstrap
  parent only for layout_initialize. The existing mutation-lease owner may then
  establish only the strict directory chain to the exact transactions_root and
  acquire the normal lock there. Transaction code never chooses layout roots or
  anchors.

problem: >
  Mutation lease and active journal require transactions_root before effects can
  run, but a clean layout's target transactions root can itself be absent. A
  SetupEngine/InstallLayout side mkdir or hidden ancestor search would create a
  second mutation/path authority. Minimal monotonic transaction-storage scaffolding
  therefore belongs to the transaction lease owner.

hierarchy:
  lego:
    brick: InstallTransactionCoordinator
    subowner: InstallMutationLeaseProvider transaction-storage bootstrap
    does_not_own:
      - semantic layout root/anchor selection
      - component/provider directories
      - installed authority
      - arbitrary mkdir or cleanup
  solid:
    single_responsibility: establish/admit exact caller-selected transaction storage and acquire its one scope lease
    interface_segregation: optional bootstrap parent is exposed only on transaction plan/lease acquisition
  cupid:
    - explicit caller parent
    - idempotent monotonic directory scaffolding
    - exact no-follow admission after each create/race
    - one persistent lock/journal root
  kiss: >
    Walk one bounded relative directory chain, then run existing lease logic. No
    bootstrap transaction, path registry, directory service, cleanup workflow, or
    semantic root resolver.

public_plan_delta:
  header: include/arena/application/installer/install_transaction.hpp
  exact_field:
    struct: InstallTransactionPlan
    name: transactions_bootstrap_parent
    type: std::optional<std::filesystem::path>
    position: immediately after transactions_root
  rules:
    - layout_initialize requires transactions_bootstrap_parent present
    - every other transaction operation requires it absent
    - root and parent are absolute, normalized, bounded, non-filesystem-root paths
    - parent is a strict ancestor of transactions_root under target-platform semantics
    - relative suffix parent->root has 1..32 safe path components
    - caller supplies both paths; transaction never climbs/derives a parent
  persistence: >
    Bootstrap parent is pre-journal input only and is not added to journal v2.
    After the first journal exists, transactions_root exists and ordinary
    recover(transactions_root, scope) is sufficient. A crash before journal may
    leave only reusable non-authoritative ordinary-directory scaffolding.

lease_port_delta:
  header: include/arena/ports/install_transaction.hpp
  exact_shape: |
    class InstallMutationLeaseProvider {
      public:
        virtual ~InstallMutationLeaseProvider() = default;
        [[nodiscard]] std::unique_ptr<InstallMutationLease> acquire(
            const std::filesystem::path& transactions_root,
            const std::optional<std::filesystem::path>& bootstrap_parent,
            arena::ports::InstallScope scope,
            std::chrono::milliseconds timeout);
      protected:
        [[nodiscard]] virtual std::unique_ptr<InstallMutationLease>
        acquire_validated(
            const std::filesystem::path& transactions_root,
            const std::optional<std::filesystem::path>& bootstrap_parent,
            arena::ports::InstallScope scope,
            std::chrono::steady_clock::time_point deadline) = 0;
    };
  rules:
    - public acquire validates root/parent shape and captures one deadline once
    - absent bootstrap parent preserves existing behavior: transactions_root must already admit as exact ordinary directory
    - present parent permits only monotonic creation of missing components on its strict relative path to transactions_root
    - parent itself is never created, removed, replaced, renamed, or recursively cleaned

native_bootstrap_algorithm:
  before_lock:
    - exact-admit bootstrap parent no-follow as ordinary directory with stable native identity
    - revalidate strict descendant relation and frozen bounded suffix
    - walk suffix component-by-component relative to the admitted parent/current directory capability
    - existing component must admit as exact ordinary non-link/non-reparse directory
    - absent component is create-new; immediately reopen/admit it no-follow
    - concurrent create winner is accepted only after exact ordinary-directory admission
    - reject substitution, binding change, escape, special/link object, permission failure, or deadline expiration
    - use native default/inherited directory permissions; this bootstrap does not invent, broaden, narrow, or own layout ACL/access policy
    - after reaching transactions_root revalidate chain binding
    - only then create/open the existing persistent `.arena-install-mutation.lock` and acquire the exclusive lease
  after_lock:
    - revalidate transactions_root/lock binding before returning
    - journal/history/work use normal arena_install_transaction_v2 paths
  concurrency: >
    Competing clean initializations may race only on idempotent directory creation,
    converge on the same exact ordinary root, then serialize on the one lock. No
    descriptor, locator, receipt, payload, provider or service authority mutates
    before that lease.

failure_and_recovery:
  before_journal:
    - no transaction journal/authority exists
    - already-created ordinary scaffolding remains and is never rollback-cleaned
    - retry exact-admits/reuses it
  after_root_before_journal:
    - retry uses same root and normal lease acquisition
  after_journal:
    - ordinary recover(transactions_root, scope) applies with no bootstrap parent
  rationale: >
    Empty transaction-storage scaffolding is non-authoritative infrastructure;
    leaving it is safer and more deterministic than unjournaled deletion.

operation_constraints:
  layout_initialize:
    root: target InstallLayout resolved roots.transactions
    bootstrap_parent: exact terminal validated-policy anchor owning target data root
  layout_migrate:
    root: exact current InstalledLayoutAuthority resolved roots.transactions
    bootstrap_parent: absent
  ordinary_install_update_repair_replacement:
    root: exact current InstalledLayoutAuthority resolved roots.transactions
    bootstrap_parent: absent
  uninstall:
    root: exact current installed authority until terminal direction
    bootstrap_parent: absent

security_bounds:
  - no environment/default/opposite-scope fallback
  - no nearest-existing-ancestor discovery
  - no unadmitted recursive create_directories pathname walk
  - no symlink/junction/reparse traversal
  - no filesystem-root parent/root
  - no deletion of bootstrap scaffolding during rollback/cleanup
  - directory existence never implies installed/layout authority or receipt evidence

implementation_relationship:
  - TX-01 adds exact InstallTransactionPlan field and common operation/path validation
  - TX-02 owns exact lease-port signature and Windows/Linux secure bootstrap/admission
  - TX-06 passes validated optional parent into lease acquisition before journal creation
  - IL-07 is the only v1 caller supplying it and derives it from validated InstallLayout policy/anchor authority

validation:
  - existing-root lease unchanged with parent absent
  - layout_initialize missing parent rejected; every other operation with parent rejected
  - equal/non-ancestor/escaped/over-depth/unsafe parent/root rejected
  - fully absent and partially-existing chains converge to exact root
  - concurrent creation converges then lock serializes
  - link/reparse/special/substitution at parent/intermediate rejected
  - failure after each create leaves only reusable ordinary scaffolding and no journal/authority
  - default/inherited permissions used; no ACL-policy code introduced
  - crash after root before journal retryable; post-journal recovery needs no parent
  - no semantic root/anchor inference in transaction code

stop_conditions:
  - bootstrap needs mutation outside strict parent->transactions_root chain
  - a second mutation lock/journal owner appears necessary
  - recovery after journal would require persisting bootstrap parent
  - native implementation cannot distinguish ordinary directory from link/reparse/special
  - caller asks transaction code to select layout anchor/root
