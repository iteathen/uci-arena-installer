meta:
  spec_id: arena_installer_foundation_v1
  version: 1
  status: active
  owner: installer_governance

north_star: >
  Assemble independently released UCI Arena components into a recoverable,
  comprehensible installation without making any component repository the
  owner of the complete product.

principles:
  lego:
    - Each component repository describes the artifact it owns through a
      versioned manifest and immutable provenance.
    - The installer owns compatibility resolution, planning, staging,
      validation, commit, recovery, and operator reporting.
    - A foreseeable change replaces package data, policy, a validator, or an
      adapter rather than rewriting the lifecycle.
  boundaries:
    - Provider source trees are never installer inputs.
    - Product names never select implementation behavior.
    - Platform behavior remains behind explicit adapters.
    - Internal provider SDK and storage types never cross the manifest or
      public service boundary.
  reliability:
    - Validate manifests and package identity before mutation.
    - Plan before mutation; stage and validate before replacement.
    - Preserve user-owned data and the last working installation.
    - Make rollback and rollback failure visible.
    - Repeated execution is idempotent.
  release:
    - The installer engine and product composition have independent versions.
    - Composition pins exact component versions, artifacts, manifests,
      provenance, and compatibility.
    - Read-only pull-request CI is enabled; release activity is explicit and private until
      approved.

hard_rules:
  - Never read a component repository's source tree during composition.
  - Never place credentials in manifests, logs, arguments, or receipts.
  - Never weaken provenance or repository visibility to make composition pass.
  - Never bypass legitimate Windows elevation for an All users installation.
  - Never leave two Manager or provider daemon authorities active for one
    installation scope.
